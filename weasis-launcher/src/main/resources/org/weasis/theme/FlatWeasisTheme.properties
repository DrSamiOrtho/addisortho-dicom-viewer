#
# Addis Ortho dark theme, on top of FlatDarkLaf.
# Surfaces are near-black with a slight #034537 cast; selection is the brand pair white on #034537.
# #A8FF30 is for small accents only (focus ring, tab underline, toggles), never text or large fills.
# Image panes are painted by the viewers and stay neutral black.

#---- variables ----

@background = #15201C
@foreground = #E6EDEA
@accentColor = #A8FF30
@selectionBackground = #034537
@selectionForeground = #FFFFFF
@selectionInactiveBackground = #1F2E28
@disabledForeground = #5E6B66
@componentBackground = #1C2823
@buttonBackground = #22312B
@menuBackground = #0F1714

@aoChrome = #0F1714
@aoBorder = #2E3D37
@aoHover = #22312B
@aoPressed = #2A3B34
@aoSecondary = #9BAAA3

#---- shapes ----

Component.arc = 6
Button.arc = 8
CheckBox.arc = 4
TextComponent.arc = 6
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 10
Component.focusWidth = 0
Component.innerFocusWidth = 1
Button.innerFocusWidth = 1
Button.margin = 3,10,3,10

#---- colours ----

Component.borderColor = @aoBorder
Component.disabledBorderColor = @aoBorder
Component.focusedBorderColor = @accentColor
Component.focusColor = @accentColor
Separator.foreground = @aoBorder
Label.disabledForeground = @disabledForeground
Component.infoForeground = @aoSecondary

Panel.background = @background

# DockingFrames (Explorer and viewer tabs) derives its tab outlines from these Swing system colours
controlDkShadow = @aoBorder
windowBorder = @aoBorder
ToolBar.background = @background
ToolBar.separatorColor = #3A4A43
ToolBar.hoverButtonGroupBackground = @aoHover
MenuBar.background = @aoChrome
MenuBar.borderColor = @aoBorder
TitlePane.background = @aoChrome
TitlePane.inactiveBackground = @aoChrome
TitlePane.unifiedBackground = false
PopupMenu.borderColor = @aoBorder
MenuItem.selectionBackground = @selectionBackground
Menu.selectionBackground = @selectionBackground

Button.background = @buttonBackground
Button.borderColor = @aoBorder
Button.hoverBackground = @aoHover
Button.pressedBackground = @aoPressed
Button.default.background = @selectionBackground
Button.default.foreground = #FFFFFF
Button.default.borderColor = @selectionBackground
Button.default.hoverBackground = #075A48
Button.default.focusedBorderColor = @accentColor
Button.toolbar.hoverBackground = @aoHover
Button.toolbar.pressedBackground = @aoPressed
Button.toolbar.selectedBackground = @selectionBackground
ToggleButton.selectedBackground = @selectionBackground
ToggleButton.selectedForeground = #FFFFFF
ToggleButton.toolbar.selectedBackground = @selectionBackground

TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = @aoSecondary
TabbedPane.tabSelectionHeight = 2
TabbedPane.hoverColor = @aoHover
TabbedPane.focusColor = #1A2C25
TabbedPane.selectedBackground = @background
TabbedPane.contentAreaColor = @aoBorder

List.background = @componentBackground
Table.background = @componentBackground
Table.gridColor = @aoBorder
TableHeader.background = @aoChrome
TableHeader.separatorColor = @aoBorder
TableHeader.bottomSeparatorColor = @aoBorder
Tree.background = @componentBackground

ScrollBar.track = @background
ScrollBar.thumb = #33443D
ScrollBar.hoverThumbColor = #40534B
ScrollBar.pressedThumbColor = #4C6158

ProgressBar.foreground = @accentColor
ProgressBar.background = @aoBorder
Slider.thumbColor = @accentColor
Slider.trackValueColor = @accentColor
Slider.trackColor = @aoBorder

SplitPane.background = @aoChrome
SplitPaneDivider.draggingColor = @selectionBackground
ToolTip.background = #0B120F
ToolTip.foreground = @foreground
