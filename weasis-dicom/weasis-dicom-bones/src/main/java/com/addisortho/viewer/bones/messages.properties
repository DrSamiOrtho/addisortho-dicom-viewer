BoneGrowTool.find=Find the bones
BoneGrowTool.find.tip=Separates all the bone shown in the 3D view into bones at the joints, each in its own colour. Find the bones again replaces the list; Undo brings it back.
BoneGrowTool.finding=Finding the bones...
BoneGrowTool.found=%d bones found. Click one to select it.
BoneGrowTool.foundFragments=%d small fragments were joined to the bone beside them; Split takes one out.
BoneGrowTool.foundJointsSkipped=The bone shown is too large for the small joints to be opened: bones pressed together (wrist, foot, fingers) may be listed as one. Crop the 3D view to the region and find the bones again.
BoneGrowTool.foundNone=No bone found in the 3D view.
BoneGrowTool.autoName=Bone %d
BoneGrowTool.showAll=Show all
BoneGrowTool.showAll.tip=Shows every bone of the list again.
BoneGrowTool.join=Join
BoneGrowTool.join.tip=Makes the selected bones one bone, such as the radius and a fragment. Press Select more, then click each bone to select several.
BoneGrowTool.joinTwo=Select two bones or more to join them: press Select more, then click the second.
BoneGrowTool.joined=%d bones joined into %s.
BoneGrowTool.split.tip=Separates two parts between two clicks, on a slice or in 3D, along a dark line of the CT where it finds one. A fragment: click it, then the bone it must come away from. Two bones with a part of one coloured as the other: click well inside each, and the viewer tries to draw the border between them again from the brightness of the CT and the two clicks. Check the new border on the slices: it may not follow the joint. Where the new border would leave one of the two almost nothing, nothing is changed. Undo takes it back.
BoneGrowTool.splitFirst=Separate: click the fragment, on a slice or in 3D.
BoneGrowTool.splitSecond=Separate: now click the bone the fragment must come away from.
BoneGrowTool.name=Name
BoneGrowTool.name.tip=Names the selected bone.
BoneGrowTool.selectFirst=Select a bone first: click it in the 3D view, on a slice or in the list.
BoneGrowTool.selected=%s selected.
BoneGrowTool.selectedMany=%d bones selected.
BoneGrowTool.nothingThere=No bone there; nothing is selected.
BoneGrowTool.visible.tip=Shown in the 3D picture; untick to hide it
BoneGrowTool.more.how=<html><body style='width:230px'>For a bone the search missed: choose its name, press New bone, then click it. Erase piece cuts a leak off a bone.</body></html>
BoneGrowTool.hidden=%s hidden. Tick it in the list, or press Show all, to show it again.
BoneGrowTool.natural=Natural look
BoneGrowTool.natural.tip=Shows the bones as the CT shows bone, without their colours. Hidden bones stay hidden; Show all brings back the whole natural picture. Untick for the colours.
BoneGrowTool.solid=Solid bones
BoneGrowTool.solid.tip=Draws each bone as a solid surface in its colour, from its outline as found: thin or weak bone shows no holes and no soft patches. The fine surface detail of the CT (a hairline crack) is not shown this way: untick to see the CT itself in the bones' colours.
BoneGrowTool.findHint=3D shows the bone without the cast and the table. Press Find the bones to separate the bones and see them in colour.
BoneGrowTool.showBones=Show the bones
BoneGrowTool.findAgain=Find the bones again
BoneGrowTool.splitFragment=Fragment: %s. Now click the bone it must come away from.
BoneGrowTool.separated=%s: %.2f cm³, separated from %s (%.1f cm³), along the darkest line between your clicks. It is selected; Undo takes it back.
BoneGrowTool.separateEmpty=Nothing was separated: one side would be almost empty. Press Separate again and click the fragment and the other bone further apart, each well inside its own part.
