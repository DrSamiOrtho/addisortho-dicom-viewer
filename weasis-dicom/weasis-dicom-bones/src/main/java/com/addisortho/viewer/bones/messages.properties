BoneGrowTool.title=Bones
BoneGrowTool.region=Region
BoneGrowTool.region.tip=The part of the body: its bones are listed under Bone.
BoneGrowTool.preset=Bone
BoneGrowTool.side=Side
BoneGrowTool.side.tip=Right or left, for the bones that come in pairs. The new bone is named with it.
BoneGrowTool.preset.tip=The bone to click next: the new bone gets its name, and its threshold, separation from the neighbouring bone and other settings. They can be changed under More settings.
BoneGrowTool.new=New bone
BoneGrowTool.new.hint=New bone: click a bone. It is selected in colour and added to the list. Bones already in the list are left out of it.
BoneGrowTool.erase=Erase piece
BoneGrowTool.erase.hint=Erase piece: click an unwanted part of a coloured bone (a leak into the table, a vessel or the next bone). It is cut off where it joins the bone and erased.
BoneGrowTool.split=Separate
BoneGrowTool.pickTool=Click a bone in the 3D view or on a slice to select it; Shift-click adds more. A drag still turns the view.
BoneGrowTool.busy=Wait until the last click is done.
BoneGrowTool.growing=Selecting the bone...
BoneGrowTool.erasing=Erasing the piece...
BoneGrowTool.splitting=Splitting the bone...
BoneGrowTool.cancel=Cancel
BoneGrowTool.cancelled=Cancelled.
BoneGrowTool.list=Bones on this CT
BoneGrowTool.none=No bone yet. Open the CT in the 3D view, or press Find the bones.
BoneGrowTool.row=%s  (%.0f cm³)
BoneGrowTool.colour.tip=Change the colour
BoneGrowTool.rename=Name of the bone: choose one or type it
BoneGrowTool.rename.tip=Click to select, double-click to rename
BoneGrowTool.only=Show only
BoneGrowTool.only.tip=Shows the selected bones alone in the 3D picture.
BoneGrowTool.hide=Hide
BoneGrowTool.hide.tip=Takes the selected bones out of the 3D picture, so what lies behind shows. They stay in the list: tick them to show them again.
BoneGrowTool.delete=Delete
BoneGrowTool.delete.tip=Deletes the selected bones from the list and from the 3D picture, such as a leftover of the table. The CT itself is not changed. Undo brings them back.
BoneGrowTool.deleted=%s deleted. Undo brings it back.
BoneGrowTool.notWrittenYet=The views are still being updated with the last change. Try again in a moment.
BoneGrowTool.undo=Undo
BoneGrowTool.undo.tip=Takes back the last step: bones found, hidden, joined, split, named or deleted, or a cut or crop of the 3D view (Ctrl+Z).
BoneGrowTool.redo=Redo
BoneGrowTool.redo.tip=Does again the step taken back (Ctrl+Y).
BoneGrowTool.whole=Whole volume
BoneGrowTool.whole.tip=Shows the whole 3D volume again: every bone shown, no cut, no crop box (Ctrl+Alt+0). The bone list is kept.
BoneGrowTool.pieceName=Part of %s (%d)
BoneGrowTool.done=%s selected: %.1f cm³.
BoneGrowTool.erased=%.1f cm³ erased from %s.
BoneGrowTool.notSeparated=It could not be separated from the next bone; use Split on it.
BoneGrowTool.large=It is very large: it may have run into other bones, vessels or the table. Click the extra part with Erase piece or Split, or raise the threshold under More settings.
BoneGrowTool.alreadyIn=That point is already part of %s. To take a part of it, use Split or Erase piece.
BoneGrowTool.allTaken=Nothing new there: every voxel of it already belongs to a bone in the list.
BoneGrowTool.noBoneYet=No bone selected yet: select one with New bone first.
BoneGrowTool.noBoneThere=No coloured bone under that point. Click on the coloured bone itself.
BoneGrowTool.notSeparable=That part could not be cut off: it joins the bone too widely. Click further away from where the bone was started, or use Hide or Delete instead.
BoneGrowTool.changedMeanwhile=The bones changed during the work; click again.
BoneGrowTool.memory=Not enough memory for this step. Crop the 3D view closer to the bone and try again.
BoneGrowTool.failed=The step failed: %s
BoneGrowTool.missed=No bone under that point. Click on the bone itself.
BoneGrowTool.noCt=Open this CT in the 3D view first: the bones are shown and undone there.
BoneGrowTool.notCt=The 3D view does not show a CT.
BoneGrowTool.notRectified=The 3D volume was built without geometric correction; the bone tools need it.
BoneGrowTool.irregular=The CT images differ in size, orientation or pixel spacing, or lack their position.
BoneGrowTool.cropEmpty=The crop box holds no part of the CT.
BoneGrowTool.otherFrame=The click was on a series of another frame of reference than this CT.
BoneGrowTool.seedOutside=That point is outside this CT.
BoneGrowTool.seedOutsideBox=That point is outside the crop box.
BoneGrowTool.seedOutOfRange=No voxel between %.0f and %.0f HU near that point (%.0f HU there). Click on the bone itself, or lower the threshold under More settings.
BoneGrowTool.more=More tools
BoneGrowTool.lower=Bone threshold (HU)
BoneGrowTool.upper=Highest HU
BoneGrowTool.range.tip=CT values taken into the bone. 200 HU suits most cortical bone; thin or osteoporotic bone may need less, metal implants are above 3000 HU and stay out.
BoneGrowTool.preview=Show what counts as bone
BoneGrowTool.preview.tip=Shows on the 3D view only what is at or above the bone threshold, to check it before selecting. Untick to get the normal view back.
BoneGrowTool.closing=Closing (voxels)
BoneGrowTool.closing.tip=Seals small gaps of a thin cortex so the marrow can be filled. 0 to 2; more rounds off fine detail.
BoneGrowTool.separation=Separate from neighbour (voxels)
BoneGrowTool.separation.tip=Cuts thin bridges to a touching bone (femoral head and acetabulum, femur and tibia) while selecting. 0 for none; try 2. Split does the same afterwards with one click.
BoneGrowTool.fill=Fill holes in each slice (marrow)
BoneGrowTool.minPiece=Smallest piece kept (mm³)
BoneGrowTool.minPiece.tip=Loose pieces smaller than this are dropped, never the clicked one.
BoneGrowTool.crop=Only inside the 3D crop box
BoneGrowTool.note=Semi-automatic, not reviewed.
