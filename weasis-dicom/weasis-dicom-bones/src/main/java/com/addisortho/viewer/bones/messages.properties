BoneExportTool.saved=Saved %s
BoneExportTool.size=%,d triangles, %.1f cm³ enclosed, sample spacing %.2f mm.
BoneExportTool.fromCt=Surface at %.0f HU on the CT, inside the segment grown by %d samples.
BoneExportTool.fromSeg=Surface of the segment alone, without the CT threshold: %s.
BoneExportTool.notCt=the series is not CT
BoneExportTool.notRectified=the 3D volume was built without geometric correction
BoneExportTool.pieces=%d pieces found, %d kept.
BoneExportTool.coordinates=Coordinates in mm, DICOM patient space (LPS). Automatic surface, not reviewed: check it before printing or planning.
BoneExportTool.cancelled=Cancelled.
BoneExportTool.failed=The export failed: %s
BoneExportTool.empty=No surface: no part of this segment reaches %.0f HU on the CT.
BoneExportTool.noVoxels=This segment has no voxels.
BoneExportTool.noVolume=The segmentation could not be read as a volume.
BoneExportTool.unloaded=The segmentation was unloaded during the export. Try again.
BoneGrowTool.title=Bones
BoneGrowTool.region=Region
BoneGrowTool.region.tip=The part of the body: its bones are listed under Bone.
BoneGrowTool.preset=Bone
BoneGrowTool.side=Side
BoneGrowTool.side.tip=Right or left, for the bones that come in pairs. The new bone is named with it.
BoneGrowTool.preset.tip=The bone to click next: the new bone gets its name, and its threshold, separation from the neighbouring bone and other settings. They can be changed under More settings.
BoneGrowTool.new=New bone
BoneGrowTool.new.hint=New bone: click a bone. It is selected in colour and added to the list. Bones already in the list are left out of it.
BoneGrowTool.erase=Erase piece
BoneGrowTool.erase.hint=Erase piece: click an unwanted part of a coloured bone (a leak into the table, a vessel or the next bone). It is cut off where it joins the bone and erased.
BoneGrowTool.split=Separate
BoneGrowTool.pickTool=Click a bone on a slice or in 3D to select it. To select several: press Select more, then click each one; Unselect takes one out of the selection. To remove a bone: Hide or Delete. To correct a bone on a slice: Add here, Take out here or Cut line. To have the viewer look for the border between two parts: Separate, then click each part well inside itself, and check the new border.
BoneGrowTool.selection=Selection:
BoneGrowTool.add=Select more
BoneGrowTool.add.tip=While on, every click on a bone, on a slice or in 3D, adds it to the selection: no key to hold. Then Join, Hide, Delete or Name act on all of them. It only selects: to add bone to a bone, use Add here. Press again to go back to one bone per click.
BoneGrowTool.add.hint=Select more: click each bone to add it to the selection, on a slice or in 3D. Then Join makes them one bone. Press Select more again to stop.
BoneGrowTool.take=Unselect
BoneGrowTool.take.tip=While on, every click on a selected bone takes it out of the selection. It only unselects: to take bone out of a bone, use Take out here. Press again to go back to one bone per click.
BoneGrowTool.take.hint=Unselect: click a selected bone to take it out of the selection. Press Unselect again to stop.
BoneGrowTool.edge=On a slice:
BoneGrowTool.paint=Add here
BoneGrowTool.paint.tip=A brush: click or drag over a missing part of the selected bone on a slice, or click it in 3D. The ring on the slice is the brush. While it is on, the left button of the slices only paints. What is under the brush is added to the bone, taken from any other bone it was in. Hold Shift and click a bone to work on that bone instead. Press again to stop.
BoneGrowTool.paint.hint=Add here: on a slice, click or drag over the missing part of the selected bone (or click it in 3D). What is under the ring goes into it, out of any other bone. Shift+click another bone to work on that one. Each click or drag is one step; Undo takes it back. Press Add here again to stop.
BoneGrowTool.rub=Take out here
BoneGrowTool.rub.tip=A brush: click or drag over a part that does not belong to the bone, on a slice or in 3D. The ring on the slice is the brush. While it is on, the left button of the slices only rubs out. Hold Shift and click a bone to work on that bone instead. Press again to stop.
BoneGrowTool.rub.hint=Take out here: on a slice, click or drag over the part that does not belong (or click it in 3D). The bone's voxels under the ring leave it. To give them to the bone beside, Shift+click that bone and use Add here. Press Take out here again to stop.
BoneGrowTool.brush=Brush width (mm)
BoneGrowTool.brush.tip=Width of the brush of Add here and Take out here, in mm: the ring that follows the mouse on the slice.
BoneGrowTool.thin=This slice only
BoneGrowTool.thin.tip=Ticked: the brush changes only the slice you draw on, exactly what the ring covers. Unticked: the brush is a ball, and also changes the slices in front of and behind this one over the same distance.
BoneGrowTool.dense=Only bone
BoneGrowTool.dense.tip=Ticked: Add here adds only what looks like bone under the brush (at or above the bone threshold of More tools). Untick to add everything under the brush, as for marrow or thin, soft bone.
BoneGrowTool.cut=Cut line
BoneGrowTool.cut.tip=Cuts a bone in two along a line you draw: drag across the bone on a slice, from outside it to outside it. The line is carried straight through the bone, in front of and behind the slice. The smaller side becomes a bone of its own; Join puts it back, Undo takes the cut back.
BoneGrowTool.cut.hint=Cut line: on a slice, drag a line right across the bone, starting and ending outside it. The bone is cut along it, straight through. Press Cut line again to stop.
BoneGrowTool.cutNoBone=The line met no bone. Draw it across a coloured bone on a slice.
BoneGrowTool.cutNot=The line did not part %s. Draw it right across the bone, from outside it to outside it: where the bone is wider in front of or behind this slice, make the line longer.
BoneGrowTool.cutDone=%s: %.2f cm³, cut from %s (%.1f cm³) along your line. It is selected; Join puts it back, Undo takes the cut back.
BoneGrowTool.smooth=Smooth
BoneGrowTool.smooth.tip=Smooths the surface of the selected bones: fills notches and takes off spikes of about one voxel. Press again for more. Undo takes it back.
BoneGrowTool.smoothing=Smoothing the surface...
BoneGrowTool.smoothed=%s smoothed: %.1f cm³ (was %.1f). Undo takes it back.
BoneGrowTool.smoothedMany=%d bones smoothed. Undo takes it back.
BoneGrowTool.brushWhich=Which bone? Hold Shift and click the bone to work on, on a slice, in 3D or in the list, then paint.
BoneGrowTool.paintNothing=Nothing at or above %.0f HU under the brush. Untick Only bone to add everything under the brush, or lower the bone threshold under More tools.
BoneGrowTool.paintAlready=All of that is already in %s.
BoneGrowTool.painted=%.0f mm³ added to %s. Undo takes it back.
BoneGrowTool.rubNothing=No part of %s within the brush.
BoneGrowTool.rubAll=That would take out all of %s: use Delete instead.
BoneGrowTool.rubbed=%.0f mm³ taken out of %s. Undo takes it back.
BoneGrowTool.busy=Wait until the last click is done.
BoneGrowTool.growing=Selecting the bone...
BoneGrowTool.erasing=Erasing the piece...
BoneGrowTool.splitting=Splitting the bone...
BoneGrowTool.cancel=Cancel
BoneGrowTool.cancelled=Cancelled.
BoneGrowTool.list=Bones on this CT
BoneGrowTool.none=No bone yet. Open the CT in the 3D view, or press Find the bones.
BoneGrowTool.row=%s  (%.0f cm³)
BoneGrowTool.colour.tip=Change the colour
BoneGrowTool.rename=Name of the bone: choose one or type it
BoneGrowTool.rename.tip=Click to select, double-click to rename
BoneGrowTool.only=Show only
BoneGrowTool.only.tip=Shows the selected bones alone in the 3D picture.
BoneGrowTool.hide=Hide
BoneGrowTool.hide.tip=Takes the selected bones out of the 3D picture, so what lies behind shows. They stay in the list: tick them to show them again.
BoneGrowTool.delete=Delete
BoneGrowTool.delete.tip=Deletes the selected bones from the list and from the 3D picture, such as a leftover of the table. The CT itself is not changed. Undo brings them back.
BoneGrowTool.deleted=%s deleted. Undo brings it back.
BoneGrowTool.notWrittenYet=The views are still being updated with the last change. Try again in a moment.
BoneGrowTool.undo=Undo
BoneGrowTool.undo.tip=Takes back the last step: bones found, hidden, joined, separated, cut, painted, named or deleted, or a cut or crop of the 3D view (Ctrl+Z).
BoneGrowTool.redo=Redo
BoneGrowTool.redo.tip=Does again the step taken back (Ctrl+Y).
BoneGrowTool.noUndo=Nothing to take back.
BoneGrowTool.noRedo=Nothing to do again.
BoneGrowTool.whole=Whole volume
BoneGrowTool.whole.tip=Shows the whole 3D volume again: every bone shown, no cut, no crop box (Ctrl+Alt+0). The bone list is kept.
BoneGrowTool.pieceName=Part of %s (%d)
BoneGrowTool.done=%s selected: %.1f cm³.
BoneGrowTool.erased=%.1f cm³ erased from %s.
BoneGrowTool.notSeparated=It could not be separated from the next bone; use Split on it.
BoneGrowTool.large=It is very large: it may have run into other bones, vessels or the table. Click the extra part with Erase piece or Split, or raise the threshold under More settings.
BoneGrowTool.alreadyIn=That point is already part of %s. To take a part of it, use Split or Erase piece.
BoneGrowTool.allTaken=Nothing new there: every voxel of it already belongs to a bone in the list.
BoneGrowTool.noBoneYet=No bone selected yet: select one with New bone first.
BoneGrowTool.noBoneThere=No coloured bone under that point. Click on the coloured bone itself.
BoneGrowTool.notSeparable=That part could not be cut off: it joins the bone too widely. Click further away from where the bone was started, or use Hide or Delete instead.
BoneGrowTool.changedMeanwhile=The bones changed during the work; click again.
BoneGrowTool.memory=Not enough memory for this step. Crop the 3D view closer to the bone and try again.
BoneGrowTool.failed=The step failed: %s
BoneGrowTool.missed=No bone under that point. Click on the bone itself.
BoneGrowTool.noCt=Open this CT in the 3D view first: the bones are shown and undone there.
BoneGrowTool.notCt=The 3D view does not show a CT.
BoneGrowTool.notRectified=The 3D volume was built without geometric correction; the bone tools need it.
BoneGrowTool.irregular=The CT images differ in size, orientation or pixel spacing, or lack their position.
BoneGrowTool.cropEmpty=The crop box holds no part of the CT.
BoneGrowTool.otherFrame=The click was on a series of another frame of reference than this CT.
BoneGrowTool.seedOutside=That point is outside this CT.
BoneGrowTool.seedOutsideBox=That point is outside the crop box.
BoneGrowTool.seedOutOfRange=No voxel between %.0f and %.0f HU near that point (%.0f HU there). Click on the bone itself, or lower the threshold under More settings.
BoneGrowTool.more=More tools
BoneGrowTool.lower=Bone threshold (HU)
BoneGrowTool.upper=Highest HU
BoneGrowTool.range.tip=CT values taken into the bone. 200 HU suits most cortical bone; thin or osteoporotic bone may need less, metal implants are above 3000 HU and stay out.
BoneGrowTool.preview=Show what counts as bone
BoneGrowTool.preview.tip=Shows on the 3D view only what is at or above the bone threshold, to check it before selecting. Untick to get the normal view back.
BoneGrowTool.closing=Closing (voxels)
BoneGrowTool.closing.tip=Seals small gaps of a thin cortex so the marrow can be filled. 0 to 2; more rounds off fine detail.
BoneGrowTool.separation=Separate from neighbour (voxels)
BoneGrowTool.separation.tip=Cuts thin bridges to a touching bone (femoral head and acetabulum, femur and tibia) while selecting. 0 for none; try 2. Split does the same afterwards with one click.
BoneGrowTool.fill=Fill holes in each slice (marrow)
BoneGrowTool.minPiece=Smallest piece kept (mm³)
BoneGrowTool.minPiece.tip=Loose pieces smaller than this are dropped, never the clicked one.
BoneGrowTool.crop=Only inside the 3D crop box
BoneGrowTool.note=Semi-automatic, not reviewed.
BoneGrowTool.stage.GROWING=Growing from the click
BoneGrowTool.stage.SEPARATING=Separating from the neighbours
BoneGrowTool.stage.CLOSING=Closing gaps
BoneGrowTool.stage.FILLING=Filling the marrow
