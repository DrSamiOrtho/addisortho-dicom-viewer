BoneExportTool.title=Bone STL
BoneExportTool.segment=Segment
BoneExportTool.threshold=Threshold (HU)
BoneExportTool.threshold.tip=CT value at the bone surface. 200 HU suits most cortical bone; thin or osteoporotic cortex may need less.
BoneExportTool.largest=Keep only the largest piece
BoneExportTool.largest.tip=Drops every other piece of the surface, including fracture fragments and loose bodies.
BoneExportTool.triangles=Maximum triangles
BoneExportTool.triangles.tip=0 keeps every triangle. A limit merges nearby vertices and can join surfaces that nearly touch.
BoneExportTool.export=Export bone as STL…
BoneExportTool.export.tip=Builds the surface of the chosen segment and saves it as an STL file in millimetres, DICOM patient coordinates (LPS).
BoneExportTool.cancel=Cancel
BoneExportTool.note=Automatic surface, not reviewed.
BoneExportTool.noSegment=No segment to export. Show a segmentation in the 3D view first.
BoneExportTool.fileType=STL surface
BoneExportTool.overwrite=%s already exists. Replace it?
