SeamEditor.title=Seam %d: inspect and adjust
SeamEditor.help=Drag the lower piece with the mouse until the checkerboard joins, and check the whole overlap with Flicker (arrows: 0.1 mm, Shift: 1 mm; [ and ] or Shift+wheel turn it 0.1 degree). Then press Refine automatically from here: the match is measured from your position, with the gates and a check for a rival position nearby, and the seam can pass. The green rings are the points that drove the fit. Or pick matching points: click a point in the upper piece, then the same point in the lower one; three or more pairs on bone, spread across the overlap.
SeamEditor.dragTip=Drag to move the lower piece; Shift+wheel to turn it
SeamEditor.flicker=Flicker
SeamEditor.refine=Refine automatically from here
SeamEditor.refineTip=Matches the pieces finely from the position shown, without a rough search but with every gate and a check for a rival position within 25 mm, and measures the residual and uncertainty: a seam lined up by hand can pass
