name: Smoke test installers (Addis Ortho DICOM Viewer)
on:
  # By hand: test the installers of any run of "Build installers (Addis Ortho DICOM Viewer)".
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of build-installer.yml whose macOS and Windows installer artifacts are tested'
        required: true
  # Automatically: after a tag build (ao-*) succeeded, test the installers of that run. GitHub runs a
  # workflow_run workflow from the default branch only, so this starts once the file is on main.
  workflow_run:
    workflows: ["Build installers (Addis Ortho DICOM Viewer)"]
    types: [completed]

# Reads the installer artifacts of another run; never writes to the repo.
permissions:
  actions: read
  contents: read

env:
  RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}

# Every check prints a "CHECK PASS|FAIL: name -- evidence" line instead of stopping the step; the
# last step of each job fails the job if any check failed. Screenshots are printed to the job log as
# base64 between "=====SHOT <name> BEGIN=====" and "=====SHOT <name> END=====" lines (see
# .github/scripts/smoke_helper.py), because artifacts cannot always be downloaded.
jobs:
  linux-ui:
    # A workflow_run starts for every build run; a successful tag build (event push) or build on main is tested.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: "Addis Ortho Viewer"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # the commit that was built (a workflow_run would otherwise check out the default branch)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'

      - name: Build with Maven
        shell: bash
        run: |
          mvn -B -ntp install -DskipTests
          mvn -B -ntp -P compressXZ -f weasis-distributions clean package
          ls -la weasis-distributions/target/native-dist/

      - name: Make the Linux app image with jpackage
        shell: bash
        run: |
          FVERSION=$(awk -F'[<>]' '/<revision>/{print $3}' weasis-parent/pom.xml)$(awk -F'[<>]' '/<changelist>/{print $3}' weasis-parent/pom.xml)
          CVERSION=$(echo "$FVERSION" | sed -e 's/"//g' -e 's/-.*//' -e 's/\(\([0-9]\+\.\)\{2\}[0-9]\+\)\.[0-9]\+/\1/')
          echo "Weasis version $FVERSION, installer version $CVERSION"
          mkdir -p native-dist
          unzip -q -o weasis-distributions/target/native-dist/weasis-native.zip -d native-dist/weasis-native
          IN=native-dist/weasis-native/bin-dist/weasis
          SCRIPT=native-dist/weasis-native/build/script
          RES="$SCRIPT/resources/linux"
          # Same preparation as .github/workflows/build-installer.yml
          rm -f "$IN"/*.jar.pack.gz
          find "$IN"/bundle/weasis-opencv-core-* -type f ! -name "*-linux-x86-64-*" -exec rm -f {} \;
          find "$IN"/bundle/jogamp-* -type f ! -name "*-linux-x86-64-*" ! -name "jogamp-[0-9]*" -exec rm -f {} \;
          ls "$IN/bundle/" | head -80
          if [[ -f "$SCRIPT/prepare-input-site.sh" ]] ; then bash "$SCRIPT/prepare-input-site.sh" "$IN"; fi
          # JDK_MODULES, customOptions and commonOptions are shared with package-weasis.sh
          source "$SCRIPT/launch-options.sh" linux
          jpackage --type app-image --input "$IN" --dest output-dist --name "$NAME" \
            --main-jar weasis-launcher.jar --main-class org.weasis.launcher.AppLauncher --add-modules "$JDK_MODULES" \
            --resource-dir "$RES" --app-version "$CVERSION" --add-launcher "Dicomizer=$RES/dicomizer-launcher.properties" \
            "${customOptions[@]}" "${commonOptions[@]}"
          ls -la "output-dist/$NAME" "output-dist/$NAME/bin"
          echo "--- launcher configuration"
          cat "output-dist/$NAME/lib/app/$NAME.cfg"

      - name: Install X tools, Python helper and the public sample DICOMDIR
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool wmctrl imagemagick openbox x11-utils fonts-dejavu-core
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          RESULTS="$RUNNER_TEMP/results.txt"
          res() { echo "CHECK $1: $2 -- $3" | tee -a "$RESULTS"; }
          EOF
          python3 -m venv "$RUNNER_TEMP/venv"
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -m pip install --quiet pillow pydicom
          echo "PY=$PY" >> "$GITHUB_ENV"
          DICOMDIR=$("$PY" .github/scripts/smoke_helper.py sample "$RUNNER_TEMP/dicom-sample" | tr -d '\r')
          echo "DICOMDIR=$DICOMDIR" >> "$GITHUB_ENV"
          echo "DICOMDIR is $DICOMDIR"
          EXTRA_DIR=$("$PY" .github/scripts/smoke_helper.py extra "$RUNNER_TEMP/dicom-extra" | tr -d '\r')
          echo "EXTRA_DIR=$EXTRA_DIR" >> "$GITHUB_ENV"
          echo "EXTRA_DIR is $EXTRA_DIR"; ls -la "$EXTRA_DIR"

      - name: Run the app under Xvfb, check there is no first-launch dialog, screenshot
        shell: bash {0}
        run: |
          source "$RUNNER_TEMP/lib.sh"
          export SHOT_DIR="$RUNNER_TEMP/shots"; mkdir -p "$SHOT_DIR"
          export DISPLAY=:99
          H=.github/scripts/smoke_helper.py
          Xvfb :99 -screen 0 1600x1000x24 -ac > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          sleep 3
          openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          sleep 2
          xdpyinfo | grep -E 'dimensions|vendor string'

          grab() { import -window root "$RUNNER_TEMP/raw.png" 2>&1 && "$PY" "$H" shot "$1" --from "$RUNNER_TEMP/raw.png"; }
          disc_open() { wmctrl -l | grep -q "First Time Launch"; }

          rm -rf "$HOME/.weasis"
          APP="$PWD/output-dist/$NAME/bin/$NAME"
          # Same command line as the CD autorun (weasis-distributions/resources/isowriter/RUN.bat): load the
          # DICOMDIR found in the current directory.
          CD_ARG='weasis://%24dicom%3Aget%20-p%20%24weasis%3Aconfig%20pro%3D%22weasis.portable.dir%20.%22'
          ( cd "$(dirname "$DICOMDIR")" && exec "$APP" "$CD_ARG" ) > "$RUNNER_TEMP/app.out" 2>&1 &
          APP_PID=$!
          echo "launched pid $APP_PID in $(dirname "$DICOMDIR") with $CD_ARG"
          sleep 6
          echo "--- windows at 6 s"; wmctrl -l
          grab linux-0-splash

          MAIN=""
          for i in $(seq 1 180); do
            MAIN=$(wmctrl -l | grep -v "First Time Launch" | grep "Addis Ortho DICOM Viewer")
            [ -n "$MAIN" ] && break
            kill -0 $APP_PID 2>/dev/null || break
            sleep 1
          done
          echo "waited $i s for the main window"
          if [ -n "$MAIN" ]; then res PASS main-window-title "$MAIN"; else res FAIL main-window-title "no window titled 'Addis Ortho DICOM Viewer'; windows: $(wmctrl -l)"; fi
          sleep 30
          echo "--- windows with main window"; wmctrl -l
          grab linux-2-main-after-DICOMDIR
          # The first-launch disclaimer is turned off (weasis.show.disclaimer false in base.json).
          if disc_open; then res FAIL no-first-launch-dialog "$(wmctrl -l | grep 'First Time Launch')"; else res PASS no-first-launch-dialog "no 'First Time Launch' window"; fi
          kill -0 $APP_PID 2>/dev/null && res PASS process-alive "pid $APP_PID alive after load" || res FAIL process-alive "pid $APP_PID exited"

          echo "--- second launch with three .dcm files (like 'Open with') is forwarded to the running instance"
          "$APP" "$EXTRA_DIR/CT_small.dcm" "$EXTRA_DIR/MR_small.dcm" "$EXTRA_DIR/JPEG2000.dcm" > "$RUNNER_TEMP/app2.out" 2>&1
          echo "second launch exit code $?"; head -5 "$RUNNER_TEMP/app2.out" | cut -c1-200
          sleep 20
          grab linux-3-main-after-local-load

          MW=$(echo "$MAIN" | head -1 | awk '{print $1}')
          if [ -n "$MW" ]; then
            wmctrl -ia "$MW"; sleep 1
            xdotool key --clearmodifiers F10; sleep 1
            xdotool key Left; sleep 1
            xdotool key Down; sleep 1
            grab linux-4-help-menu
            xdotool key Up; sleep 1
            xdotool key Return; sleep 4
            grab linux-5-about
          fi

          echo "--- java processes"; ps -eo pid,etime,rss,args | grep -i "[a]ddis" | cut -c1-250
          kill $APP_PID 2>/dev/null; sleep 8; pkill -9 -f "Addis Ortho Viewer" 2>/dev/null
          echo "--- app stdout/stderr, without stack frames ($(wc -l < "$RUNNER_TEMP/app.out") lines in total)"
          grep -v -E "^\s+at |Unregister|Deactivate" "$RUNNER_TEMP/app.out" | cut -c1-300 | head -400
          exit 0

      - name: Print the Weasis logs
        if: always()
        shell: bash {0}
        run: |
          ls -laR "$HOME/.weasis" 2>&1 | head -120
          for f in "$HOME"/.weasis/log/*; do
            [ -f "$f" ] || continue
            echo "=================== $f ($(wc -l < "$f") lines)"
            tail -n 120 "$f"
          done
          echo "=================== error lines in the logs"
          grep -h -i -E "ERROR|Exception|Refusing" "$HOME"/.weasis/log/* 2>/dev/null | head -40
          mkdir -p "$RUNNER_TEMP/out"; cp -r "$HOME/.weasis/log" "$RUNNER_TEMP/out/log" 2>/dev/null
          exit 0

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: smoke-linux-ui
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/out
            ${{ runner.temp }}/app.out
          if-no-files-found: warn

      - name: Verdict
        if: always()
        shell: bash {0}
        run: |
          echo "=============== RESULTS linux-ui"
          cat "$RUNNER_TEMP/results.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$RUNNER_TEMP/results.txt" ] || grep -q "CHECK FAIL" "$RUNNER_TEMP/results.txt"; then exit 1; fi

  macos:
    name: macos (${{ matrix.arch }})
    # A workflow_run starts for every build run; a successful tag build (event push) or build on main is tested.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: aarch64
          - os: macos-15-intel
            arch: x86-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # the commit that was built (a workflow_run would otherwise check out the default branch)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download the installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: addisortho-viewer-macosx-${{ matrix.arch }}-*
          merge-multiple: true
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: dl

      - name: Python helper and the public sample DICOMDIR
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          RESULTS="$RUNNER_TEMP/results.txt"
          res() { echo "CHECK $1: $2 -- $3" | tee -a "$RESULTS"; }
          EOF
          python3 -m venv "$RUNNER_TEMP/venv"
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -m pip install --quiet pillow pydicom
          echo "PY=$PY" >> "$GITHUB_ENV"
          DICOMDIR=$("$PY" .github/scripts/smoke_helper.py sample "$RUNNER_TEMP/dicom-sample" | tr -d '\r')
          echo "DICOMDIR=$DICOMDIR" >> "$GITHUB_ENV"
          echo "DICOMDIR is $DICOMDIR"
          EXTRA_DIR=$("$PY" .github/scripts/smoke_helper.py extra "$RUNNER_TEMP/dicom-extra" | tr -d '\r')
          echo "EXTRA_DIR=$EXTRA_DIR" >> "$GITHUB_ENV"
          echo "EXTRA_DIR is $EXTRA_DIR"; ls -la "$EXTRA_DIR"
          sw_vers; uname -m

      - name: Install the pkg and inspect the app bundle
        shell: bash {0}
        run: |
          source "$RUNNER_TEMP/lib.sh"
          ls -la dl; cat dl/*.sha256
          PKG=$(find dl -name '*.pkg' | head -1)
          shasum -a 256 "$PKG"
          sudo installer -pkg "$PKG" -target / -verbose
          rc=$?
          if [ $rc -eq 0 ]; then res PASS pkg-install "installer exit code 0 for $(basename "$PKG")"; else res FAIL pkg-install "installer exit code $rc"; fi

          APP="/Applications/Addis Ortho Viewer.app"
          ls -la /Applications | grep -i -E "addis|weasis"
          if [ -d "$APP" ]; then res PASS app-installed "$APP"; else res FAIL app-installed "$APP missing"; fi
          P="$APP/Contents/Info.plist"
          PB=/usr/libexec/PlistBuddy
          for k in CFBundleIdentifier CFBundleName CFBundleDisplayName CFBundleExecutable CFBundleIconFile CFBundleShortVersionString CFBundleVersion NSHumanReadableCopyright LSMinimumSystemVersion; do
            echo "$k = $($PB -c "Print :$k" "$P" 2>&1)"
          done
          echo "--- CFBundleURLTypes"; $PB -c "Print :CFBundleURLTypes" "$P"
          ID=$($PB -c "Print :CFBundleIdentifier" "$P" 2>&1)
          BN=$($PB -c "Print :CFBundleName" "$P" 2>&1)
          ICON=$($PB -c "Print :CFBundleIconFile" "$P" 2>&1)
          URLS=$($PB -c "Print :CFBundleURLTypes" "$P" 2>&1)
          [ "$ID" = "com.addisortho.viewer" ] && res PASS bundle-id "$ID" || res FAIL bundle-id "saw '$ID', expected com.addisortho.viewer"
          [ "$BN" = "Addis Ortho" ] && res PASS bundle-name "$BN" || res FAIL bundle-name "saw '$BN', expected 'Addis Ortho'"
          COPY=$($PB -c "Print :NSHumanReadableCopyright" "$P" 2>&1)
          WANT_COPY="© 2026 Addis Ortho Trading PLC. Based on Weasis © 2009-2026 Weasis Team"
          [ "$COPY" = "$WANT_COPY" ] && res PASS bundle-copyright "$COPY" || res FAIL bundle-copyright "saw '$COPY', expected '$WANT_COPY'"
          echo "--- launcher configuration (the java-options show the application menu name)"
          for c in "$APP"/Contents/app/*.cfg; do echo "== $c"; cat "$c"; echo; done
          grep -q -x "java-options=-Dapple.awt.application.name=Addis Ortho DICOM Viewer" "$APP/Contents/app/Addis Ortho Viewer.cfg" \
            && res PASS cfg-app-name-main "java-options=-Dapple.awt.application.name=Addis Ortho DICOM Viewer" || res FAIL cfg-app-name-main "option missing or split at the spaces in Addis Ortho Viewer.cfg"
          grep -q -x "java-options=-Dapple.awt.application.name=Addis Ortho Dicomizer" "$APP/Contents/app/Dicomizer.cfg" \
            && res PASS cfg-app-name-dicomizer "java-options=-Dapple.awt.application.name=Addis Ortho Dicomizer" || res FAIL cfg-app-name-dicomizer "option missing or split at the spaces in Dicomizer.cfg"
          echo "$URLS" | grep -q "weasis-addisortho" && res PASS url-scheme "weasis-addisortho present" || res FAIL url-scheme "weasis-addisortho not in CFBundleURLTypes"
          echo "$URLS" | grep -q -E "^ +weasis$" && res FAIL url-scheme-clash "plain 'weasis' scheme registered" || res PASS url-scheme-clash "no plain 'weasis' scheme"
          if [ -f "$APP/Contents/Resources/$ICON" ] || [ -f "$APP/Contents/Resources/$ICON.icns" ]; then res PASS icon-file "$ICON found in Resources"; else res FAIL icon-file "$ICON not found in Resources"; fi
          echo "--- Contents/MacOS"; ls -la "$APP/Contents/MacOS"
          echo "--- Contents/Resources"; ls -la "$APP/Contents/Resources"
          echo "--- codesign"; codesign -dv "$APP" 2>&1 | head -12
          CONF=$(find "$APP" -path "*/conf/base.json" | head -1)
          echo "base config: $CONF"
          python3 -c 'import json,sys; v=[p["value"] for p in json.load(open(sys.argv[1]))["weasisPreferences"] if p["code"]=="weasis.show.disclaimer"]; print(v); sys.exit(0 if v in ([False],["false"]) else 1)' "$CONF" \
            && res PASS disclaimer-off-in-config "weasis.show.disclaimer is false in $CONF" || res FAIL disclaimer-off-in-config "weasis.show.disclaimer is not false in $CONF"
          exit 0

      - name: Launch the app and screenshot
        shell: bash {0}
        run: |
          source "$RUNNER_TEMP/lib.sh"
          export SHOT_DIR="$RUNNER_TEMP/shots"; mkdir -p "$SHOT_DIR"
          H=.github/scripts/smoke_helper.py
          APP="/Applications/Addis Ortho Viewer.app"
          cat > "$RUNNER_TEMP/winlist.swift" <<'EOF'
          import CoreGraphics
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
          for w in list {
            let owner = (w[kCGWindowOwnerName as String] as? String) ?? ""
            let name = (w[kCGWindowName as String] as? String) ?? ""
            let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
            print("owner=\(owner) | title=\(name) | \(b["Width"] ?? 0)x\(b["Height"] ?? 0)+\(b["X"] ?? 0)+\(b["Y"] ?? 0)")
          }
          EOF
          cat > "$RUNNER_TEMP/handler.swift" <<'EOF'
          import AppKit
          for s in ["weasis-addisortho://x", "weasis://x"] {
            let u = NSWorkspace.shared.urlForApplication(toOpen: URL(string: s)!)
            print("handler for \(s): \(u?.path ?? "none")")
          }
          EOF
          cat > "$RUNNER_TEMP/menus.applescript" <<'EOF'
          on run argv
            tell application "System Events"
              tell process (item 1 of argv)
                set frontmost to true
                set out to ""
                repeat with mb in (menu bar items of menu bar 1)
                  try
                    set out to out & (name of mb as text) & ": "
                  end try
                  try
                    repeat with mi in (menu items of menu 1 of mb)
                      try
                        set out to out & (name of mi as text) & " | "
                      end try
                    end repeat
                  end try
                  set out to out & linefeed
                end repeat
                return out
              end tell
            end tell
          end run
          EOF
          cat > "$RUNNER_TEMP/about.applescript" <<'EOF'
          tell application "System Events"
            tell process "Addis Ortho Viewer"
              set frontmost to true
              click menu item "About Addis Ortho DICOM Viewer" of menu 1 of menu bar item "Help" of menu bar 1
              return "clicked: About Addis Ortho DICOM Viewer (Help menu)"
            end tell
          end tell
          EOF
          grab() {
            screencapture -x "$RUNNER_TEMP/raw.png" 2>&1
            [ -s "$RUNNER_TEMP/raw.png" ] && "$PY" "$H" shot "$1" --from "$RUNNER_TEMP/raw.png"
          }
          wins() { swift "$RUNNER_TEMP/winlist.swift" 2>&1 | grep -v -E "owner=(Window Server|Control Center|SystemUIServer|Dock|Spotlight|Notification Center|Finder) "; }
          key() { osascript -e "tell application \"System Events\" to $1" 2>&1; }

          rm -rf "$HOME/.weasis"
          # Same command line as the CD autorun (weasis-distributions/resources/isowriter/RUN.bat): load the
          # DICOMDIR found in the current directory.
          CD_ARG='weasis://%24dicom%3Aget%20-p%20%24weasis%3Aconfig%20pro%3D%22weasis.portable.dir%20.%22'
          ( cd "$(dirname "$DICOMDIR")" && exec "$APP/Contents/MacOS/Addis Ortho Viewer" "$CD_ARG" ) > "$RUNNER_TEMP/app.out" 2>&1 &
          APP_PID=$!
          echo "launched pid $APP_PID in $(dirname "$DICOMDIR") with $CD_ARG"
          sleep 4
          grab mac-0-splash
          sleep 36
          if kill -0 $APP_PID 2>/dev/null; then res PASS process-alive-40s "pid $APP_PID alive"; else res FAIL process-alive-40s "pid $APP_PID exited"; fi
          ps -eo pid,etime,rss,args | grep -i "[A]ddis Ortho" | cut -c1-250
          echo "--- on-screen windows"; W=$(wins); echo "$W"
          # The first-launch disclaimer is turned off (weasis.show.disclaimer false in base.json).
          echo "$W" | grep -q "title=First Time Launch" && res FAIL no-first-launch-dialog "$(echo "$W" | grep 'title=First Time Launch' | head -1)" || res PASS no-first-launch-dialog "no 'First Time Launch' window"
          echo "--- System Events processes"; osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>&1
          sleep 35
          if kill -0 $APP_PID 2>/dev/null; then res PASS process-alive-75s "pid $APP_PID alive"; else res FAIL process-alive-75s "pid $APP_PID exited"; fi
          echo "--- on-screen windows with the main window"; W=$(wins); echo "$W"
          echo "$W" | grep -q "title=Addis Ortho DICOM Viewer" && res PASS main-window-title "$(echo "$W" | grep 'title=Addis Ortho DICOM Viewer' | head -1)" || res FAIL main-window-title "no window titled Addis Ortho DICOM Viewer"
          grab mac-3-main-after-DICOMDIR

          echo "--- second launch with three .dcm files (like 'Open with') is forwarded to the running instance"
          "$APP/Contents/MacOS/Addis Ortho Viewer" "$EXTRA_DIR/CT_small.dcm" "$EXTRA_DIR/MR_small.dcm" "$EXTRA_DIR/JPEG2000.dcm" > "$RUNNER_TEMP/app2.out" 2>&1
          echo "second launch exit code $?"; head -5 "$RUNNER_TEMP/app2.out" | cut -c1-200
          sleep 20
          grab mac-4-main-after-local-load

          echo "--- menu bar contents"; MENUS=$(osascript "$RUNNER_TEMP/menus.applescript" "Addis Ortho Viewer" 2>&1); echo "$MENUS"
          APPM=$(echo "$MENUS" | grep '^Addis Ortho:')
          if echo "$APPM" | grep -q "AppLauncher"; then res FAIL app-menu-name "$APPM"
          elif echo "$APPM" | grep -q "About Addis Ortho DICOM Viewer" && echo "$APPM" | grep -q "Hide Addis Ortho DICOM Viewer" && echo "$APPM" | grep -q "Quit Addis Ortho DICOM Viewer"; then res PASS app-menu-name "$APPM"
          else res FAIL app-menu-name "unexpected application menu: $APPM"; fi
          HELPM=$(echo "$MENUS" | grep '^Help:')
          if echo "$HELPM" | grep -q -i -E "Check for Updates|Submit a Bug Report|Release Notes"; then res FAIL help-menu "upstream item present: $HELPM"
          else res PASS help-menu "no update check, bug report or release notes: $HELPM"; fi
          echo "--- open the application menu"
          osascript -e 'tell application "System Events" to tell process "Addis Ortho Viewer" to click menu bar item 2 of menu bar 1' 2>&1; sleep 2
          grab mac-5-app-menu
          key "key code 53"; sleep 1
          echo "--- open the About box from the Help menu"; osascript "$RUNNER_TEMP/about.applescript" 2>&1; sleep 4
          grab mac-6-about
          key "key code 53"; sleep 1

          echo "--- URL scheme handler as seen by LaunchServices"
          LSR=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$LSR" -f "/Applications/Addis Ortho Viewer.app"
          swift "$RUNNER_TEMP/handler.swift" 2>&1 | tee "$RUNNER_TEMP/handler.txt"
          grep -q "handler for weasis-addisortho://x: /Applications/Addis Ortho Viewer.app" "$RUNNER_TEMP/handler.txt" && res PASS url-scheme-handler "weasis-addisortho:// opens Addis Ortho Viewer.app" || res FAIL url-scheme-handler "$(grep 'weasis-addisortho' "$RUNNER_TEMP/handler.txt")"
          grep -q "handler for weasis://x: none" "$RUNNER_TEMP/handler.txt" && res PASS no-weasis-handler "weasis:// has no handler" || res FAIL no-weasis-handler "$(grep 'for weasis://' "$RUNNER_TEMP/handler.txt")"

          kill $APP_PID 2>/dev/null; sleep 8; pkill -9 -f "Addis Ortho Viewer.app" 2>/dev/null
          echo "--- app stdout/stderr, without stack frames ($(wc -l < "$RUNNER_TEMP/app.out") lines in total)"
          grep -v -E "^\s+at |Unregister|Deactivate" "$RUNNER_TEMP/app.out" | cut -c1-300 | head -400

          echo "--- Dicomizer launcher: application menu"
          "$APP/Contents/MacOS/Dicomizer" > "$RUNNER_TEMP/dicomizer.out" 2>&1 &
          DZ_PID=$!
          sleep 45
          if kill -0 $DZ_PID 2>/dev/null; then res PASS dicomizer-alive "pid $DZ_PID alive after 45 s"; else res FAIL dicomizer-alive "pid $DZ_PID exited"; fi
          echo "--- on-screen windows"; wins
          DMENUS=$(osascript "$RUNNER_TEMP/menus.applescript" "Dicomizer" 2>&1); echo "$DMENUS"
          DAPPM=$(echo "$DMENUS" | grep '^Addis Ortho:')
          osascript -e 'tell application "System Events" to tell process "Dicomizer" to click menu bar item 2 of menu bar 1' 2>&1; sleep 2
          grab mac-7-dicomizer-app-menu
          if echo "$DAPPM" | grep -q "AppLauncher"; then res FAIL dicomizer-app-menu-name "$DAPPM"
          elif echo "$DAPPM" | grep -q "About Addis Ortho Dicomizer" && echo "$DAPPM" | grep -q "Quit Addis Ortho Dicomizer"; then res PASS dicomizer-app-menu-name "$DAPPM"
          else res FAIL dicomizer-app-menu-name "unexpected application menu: $DAPPM"; fi
          kill $DZ_PID 2>/dev/null; sleep 5; pkill -9 -f "Addis Ortho Viewer.app" 2>/dev/null
          grep -v -E "^\s+at |Unregister|Deactivate" "$RUNNER_TEMP/dicomizer.out" | cut -c1-300 | head -60
          exit 0

      - name: Print logs and package receipts
        if: always()
        shell: bash {0}
        run: |
          source "$RUNNER_TEMP/lib.sh"
          find "$HOME/.weasis" -maxdepth 3 | head -60
          for f in "$HOME"/.weasis/log/*; do
            [ -f "$f" ] || continue
            echo "=================== $f ($(wc -l < "$f") lines)"
            tail -n 120 "$f"
          done
          echo "=================== error lines in the logs"
          grep -h -i -E "ERROR|Exception|Refusing" "$HOME"/.weasis/log/* 2>/dev/null | head -40
          echo "=================== crash reports"
          ls -la "$HOME/Library/Logs/DiagnosticReports" 2>&1 | head
          echo "=================== pkgutil"
          pkgutil --pkgs | grep -i addis
          PKGID=$(pkgutil --pkgs | grep -i addis | head -1)
          if [ -n "$PKGID" ]; then res PASS pkg-receipt "$PKGID"; else res FAIL pkg-receipt "no receipt matching addis"; fi
          [ -n "$PKGID" ] && pkgutil --pkg-info "$PKGID" && pkgutil --files "$PKGID" | head -8
          pkgutil --pkgs | grep -i weasis && res FAIL no-weasis-receipt "a Weasis receipt is present" || res PASS no-weasis-receipt "no receipt containing 'weasis'"
          mkdir -p "$RUNNER_TEMP/out"; cp -r "$HOME/.weasis/log" "$RUNNER_TEMP/out/log" 2>/dev/null
          exit 0

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: smoke-macos-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/out
            ${{ runner.temp }}/app.out
          if-no-files-found: warn

      - name: Verdict
        if: always()
        shell: bash {0}
        run: |
          echo "=============== RESULTS macos ${{ matrix.arch }}"
          cat "$RUNNER_TEMP/results.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$RUNNER_TEMP/results.txt" ] || grep -q "CHECK FAIL" "$RUNNER_TEMP/results.txt"; then exit 1; fi

  windows:
    # A workflow_run starts for every build run; a successful tag build (event push) or build on main is tested.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.head_branch == 'main')) }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # the commit that was built (a workflow_run would otherwise check out the default branch)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download the installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: addisortho-viewer-windows-x86-64-*
          merge-multiple: true
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: dl

      - name: Python helper, PowerShell library and the public sample DICOMDIR
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/lib.ps1" <<'EOF'
          $ErrorActionPreference = 'Continue'
          $global:ResultsFile = Join-Path $env:RUNNER_TEMP 'results.txt'
          function Res([string]$Status, [string]$Name, [string]$Detail) {
            $line = "CHECK ${Status}: $Name -- $Detail"
            Write-Host $line
            Add-Content -Path $global:ResultsFile -Value $line
          }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public class WinList {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
            public static void Click(int x, int y) {
              SetCursorPos(x, y);
              System.Threading.Thread.Sleep(400);
              mouse_event(2, 0, 0, 0, UIntPtr.Zero);
              System.Threading.Thread.Sleep(100);
              mouse_event(4, 0, 0, 0, UIntPtr.Zero);
            }
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            public static List<string> Visible() {
              var res = new List<string>();
              EnumWindows((h, l) => {
                if (IsWindowVisible(h)) {
                  var sb = new StringBuilder(256);
                  GetWindowText(h, sb, 256);
                  if (sb.Length > 0) {
                    uint pid; GetWindowThreadProcessId(h, out pid);
                    RECT r; GetWindowRect(h, out r);
                    res.Add("pid=" + pid + " | title=" + sb + " | rect=" + r.L + "," + r.T + " " + (r.R - r.L) + "x" + (r.B - r.T));
                  }
                }
                return true;
              }, IntPtr.Zero);
              return res;
            }
          }
          "@
          function Get-Wins { [WinList]::Visible() }
          function Shot([string]$Name) {
            $env:SHOT_DIR = Join-Path $env:RUNNER_TEMP 'shots'
            & $env:PY (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\smoke_helper.py') shot $Name
          }
          EOF
          python -m venv "$RUNNER_TEMP/venv"
          PY="$RUNNER_TEMP/venv/Scripts/python.exe"
          "$PY" -m pip install --quiet pillow pydicom
          echo "PY=$PY" >> "$GITHUB_ENV"
          DICOMDIR=$("$PY" .github/scripts/smoke_helper.py sample "$RUNNER_TEMP/dicom-sample" | tr -d '\r')
          echo "DICOMDIR=$DICOMDIR" >> "$GITHUB_ENV"
          echo "DICOMDIR is $DICOMDIR"
          EXTRA_DIR=$("$PY" .github/scripts/smoke_helper.py extra "$RUNNER_TEMP/dicom-extra" | tr -d '\r')
          echo "EXTRA_DIR=$EXTRA_DIR" >> "$GITHUB_ENV"
          echo "EXTRA_DIR is $EXTRA_DIR"; ls -la "$EXTRA_DIR"

      - name: Install the MSI and inspect the install
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\lib.ps1"
          Get-ChildItem dl -Recurse | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          Get-ChildItem dl -Filter *.sha256 -Recurse | ForEach-Object { Get-Content $_.FullName }
          $msi = (Get-ChildItem dl -Filter *.msi -Recurse | Select-Object -First 1).FullName
          "msi: $msi"; (Get-FileHash $msi -Algorithm SHA256).Hash
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/l*v', "`"$log`"") -Wait -PassThru
          "msiexec /i exit code: $($p.ExitCode)"
          if ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) { Res PASS msi-install "msiexec /i exit code $($p.ExitCode)" } else { Res FAIL msi-install "msiexec /i exit code $($p.ExitCode)" }
          "--- install.log highlights"
          Select-String -Path $log -Pattern 'Return value 3|Product: |INSTALLDIR|Installation (success|failed)|Error [0-9]+' | Select-Object -First 25 | ForEach-Object { $_.Line.Trim() }

          Get-ChildItem 'C:\Program Files' | Where-Object { $_.Name -match 'Addis|Weasis' } | Format-Table Name, FullName | Out-String | Write-Host
          $dir = 'C:\Program Files\Addis Ortho Viewer'
          $exe = Join-Path $dir 'Addis Ortho Viewer.exe'
          "--- $dir"
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          if (Test-Path $exe) { Res PASS install-folder "$exe exists" } else { Res FAIL install-folder "$exe missing" }
          if (Test-Path (Join-Path $dir 'Dicomizer.exe')) { "Dicomizer.exe present" }
          "--- exe version info"
          $vi = (Get-Item $exe -ErrorAction SilentlyContinue).VersionInfo
          $vi | Format-List CompanyName, ProductName, FileDescription, FileVersion, ProductVersion, LegalCopyright, OriginalFilename, InternalName | Out-String | Write-Host
          if ($vi.CompanyName -eq 'Addis Ortho Trading PLC') { Res PASS exe-vendor $vi.CompanyName } else { Res FAIL exe-vendor "saw '$($vi.CompanyName)', expected 'Addis Ortho Trading PLC'" }
          $c = [string][char]0x00A9
          $wantCopy = "$c 2026 Addis Ortho Trading PLC. Based on Weasis $c 2009-2026 Weasis Team"
          if ($vi.LegalCopyright -eq $wantCopy) { Res PASS exe-copyright $vi.LegalCopyright } else { Res FAIL exe-copyright "saw '$($vi.LegalCopyright)' ($([string]::Join(' ', ($vi.LegalCopyright.ToCharArray() | Select-Object -First 3 | ForEach-Object { [int]$_ })))), expected '$wantCopy'" }
          if ($vi.FileDescription -eq 'Addis Ortho DICOM Viewer') { Res PASS exe-description $vi.FileDescription } else { Res FAIL exe-description "saw '$($vi.FileDescription)', expected 'Addis Ortho DICOM Viewer'" }
          $dvi = (Get-Item (Join-Path $dir 'Dicomizer.exe') -ErrorAction SilentlyContinue).VersionInfo
          if ($dvi.CompanyName -eq 'Addis Ortho Trading PLC') { Res PASS dicomizer-exe-vendor $dvi.CompanyName } else { Res FAIL dicomizer-exe-vendor "saw '$($dvi.CompanyName)'" }
          "--- reg query HKCR\weasis-addisortho /s"
          $reg = (& reg query 'HKCR\weasis-addisortho' /s 2>&1 | Out-String)
          $regRc = $LASTEXITCODE
          $reg | Write-Host
          if ($regRc -eq 0 -and $reg -match 'Addis Ortho Viewer.exe') { Res PASS url-scheme-registry "HKCR\weasis-addisortho exists, command points at Addis Ortho Viewer.exe" } else { Res FAIL url-scheme-registry "reg query exit code $regRc" }
          "--- reg query HKCR\weasis (must not exist)"
          & reg query 'HKCR\weasis' 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { Res PASS no-weasis-scheme "HKCR\weasis absent" } else { Res FAIL no-weasis-scheme "HKCR\weasis exists" }
          "--- Start menu"
          $sm = @("$env:ProgramData\Microsoft\Windows\Start Menu\Programs", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs")
          $lnks = Get-ChildItem $sm -Recurse -Filter *.lnk -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Addis|Weasis' }
          $wsh = New-Object -ComObject WScript.Shell
          foreach ($l in $lnks) { "$($l.FullName) -> $($wsh.CreateShortcut($l.FullName).TargetPath)" }
          $group = $lnks | Where-Object { $_.Directory.Name -eq 'Addis Ortho Viewer' -and $_.BaseName -eq 'Addis Ortho Viewer' }
          if ($group) { Res PASS start-menu "group 'Addis Ortho Viewer': $($group[0].FullName)" } else { Res FAIL start-menu "no 'Addis Ortho Viewer\Addis Ortho Viewer.lnk' found; saw $($lnks.Count) shortcut(s)" }
          "--- Apps and features entry"
          $uk = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $ent = Get-ItemProperty $uk -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match 'Addis|Weasis' }
          $ent | Format-List DisplayName, DisplayVersion, Publisher, InstallLocation, UninstallString | Out-String | Write-Host
          if ($ent -and $ent[0].Publisher -eq 'Addis Ortho Trading PLC' -and $ent[0].DisplayName -eq 'Addis Ortho Viewer') { Res PASS apps-entry "$($ent[0].DisplayName) / $($ent[0].Publisher) / $($ent[0].DisplayVersion)" } else { Res FAIL apps-entry "entry: $($ent | Out-String)" }
          "--- file association .dcm"
          & reg query 'HKCR\.dcm' 2>&1 | Out-String | Write-Host
          $conf = Get-ChildItem $dir -Recurse -Filter base.json -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'conf' } | Select-Object -First 1
          if ($conf) {
            $v = ((Get-Content $conf.FullName -Raw | ConvertFrom-Json).weasisPreferences | Where-Object { $_.code -eq 'weasis.show.disclaimer' }).value
            "weasis.show.disclaimer in $($conf.FullName): $v"
            if ("$v" -eq 'False' -or "$v" -eq 'false') { Res PASS disclaimer-off-in-config "weasis.show.disclaimer is false in $($conf.FullName)" } else { Res FAIL disclaimer-off-in-config "weasis.show.disclaimer is '$v' in $($conf.FullName)" }
          } else { Res FAIL disclaimer-off-in-config "conf\base.json not found under $dir" }
          exit 0

      - name: Launch the app, check there is no first-launch dialog, screenshot
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\lib.ps1"
          Remove-Item "$env:USERPROFILE\.weasis" -Recurse -Force -ErrorAction SilentlyContinue
          $exe = 'C:\Program Files\Addis Ortho Viewer\Addis Ortho Viewer.exe'
          $out = Join-Path $env:RUNNER_TEMP 'app.out'; $err = Join-Path $env:RUNNER_TEMP 'app.err'
          # Same command line as the CD autorun (weasis-distributions/resources/isowriter/RUN.bat): load the
          # DICOMDIR found in the current directory.
          $cdArg = 'weasis://%24dicom%3Aget%20-p%20%24weasis%3Aconfig%20pro%3D%22weasis.portable.dir%20.%22'
          $sampleDir = Split-Path $env:DICOMDIR
          $proc = Start-Process -FilePath $exe -ArgumentList $cdArg -WorkingDirectory $sampleDir -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          "launched pid $($proc.Id) in $sampleDir with $cdArg"
          Start-Sleep -Seconds 2
          "--- visible windows at 2 s"; Get-Wins
          Shot 'win-0-splash'
          Start-Sleep -Seconds 8
          $wsh = New-Object -ComObject WScript.Shell
          $main = $null
          for ($i = 0; $i -lt 180 -and -not $main; $i++) {
            $main = Get-Wins | Where-Object { $_ -match 'title=Addis Ortho DICOM Viewer' -and $_ -notmatch 'First Time' } | Select-Object -First 1
            if (-not $main) { Start-Sleep -Seconds 1 }
          }
          "waited $i s for the main window"
          if ($main) { Res PASS main-window-title $main } else { Res FAIL main-window-title "no window titled 'Addis Ortho DICOM Viewer'" }
          Start-Sleep -Seconds 40
          "--- visible windows with the main window"; Get-Wins
          Shot 'win-2-main-after-DICOMDIR'
          # The first-launch disclaimer is turned off (weasis.show.disclaimer false in base.json).
          $disc = Get-Wins | Where-Object { $_ -match 'First Time Launch' } | Select-Object -First 1
          if ($disc) { Res FAIL no-first-launch-dialog $disc } else { Res PASS no-first-launch-dialog "no 'First Time Launch' window" }
          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if ($alive) { Res PASS process-alive "pid $($proc.Id) alive, working set $([math]::Round($alive.WorkingSet64/1MB)) MB" } else { Res FAIL process-alive "pid $($proc.Id) exited" }
          "--- processes"
          Get-Process | Where-Object { $_.Path -like 'C:\Program Files\Addis*' } | Format-Table Id, ProcessName, StartTime, WorkingSet64 -AutoSize | Out-String | Write-Host
          "--- second launch with three .dcm files (like 'Open with') is forwarded to the running instance"
          $out2 = Join-Path $env:RUNNER_TEMP 'app2.out'; $err2 = Join-Path $env:RUNNER_TEMP 'app2.err'
          $p2 = Start-Process -FilePath $exe -ArgumentList @("$env:EXTRA_DIR\CT_small.dcm", "$env:EXTRA_DIR\MR_small.dcm", "$env:EXTRA_DIR\JPEG2000.dcm") -PassThru -RedirectStandardOutput $out2 -RedirectStandardError $err2
          if ($p2.WaitForExit(40000)) { "second launch exited with code $($p2.ExitCode)" } else { "second launch still running after 40 s" }
          Get-Content $out2 -TotalCount 5 -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 20
          "--- visible windows after the second launch"; Get-Wins
          Shot 'win-3-main-after-local-load'
          "--- Help menu: F10, Left (wraps to Help), Down"
          $wsh.AppActivate('Addis Ortho DICOM Viewer') | Out-Null; Start-Sleep -Seconds 1
          [System.Windows.Forms.SendKeys]::SendWait('{F10}'); Start-Sleep -Seconds 1
          [System.Windows.Forms.SendKeys]::SendWait('{LEFT}'); Start-Sleep -Seconds 1
          [System.Windows.Forms.SendKeys]::SendWait('{DOWN}'); Start-Sleep -Seconds 1
          Shot 'win-4-help-menu'
          [System.Windows.Forms.SendKeys]::SendWait('{UP}'); Start-Sleep -Seconds 1
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}'); Start-Sleep -Seconds 4
          Shot 'win-5-about'
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          Get-Process | Where-Object { $_.Path -like 'C:\Program Files\Addis*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 4
          "--- app stdout/stderr, without stack frames"
          foreach ($f in @($out, $err)) {
            "== $f ($((Get-Content $f -ErrorAction SilentlyContinue | Measure-Object -Line).Lines) lines)"
            Get-Content $f -ErrorAction SilentlyContinue | Where-Object { $_ -notmatch '^\s+at |Unregister|Deactivate' } | Select-Object -First 300 | ForEach-Object { if ($_.Length -gt 300) { $_.Substring(0, 300) } else { $_ } }
          }
          exit 0

      - name: Print the Weasis logs
        if: always()
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\lib.ps1"
          Get-ChildItem "$env:USERPROFILE\.weasis" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 60 | ForEach-Object { $_.FullName }
          Get-ChildItem "$env:USERPROFILE\.weasis\log" -File -ErrorAction SilentlyContinue | ForEach-Object {
            "=================== $($_.FullName) ($((Get-Content $_.FullName).Count) lines)"
            Get-Content $_.FullName -Tail 120
          }
          "=================== error lines in the logs"
          Get-ChildItem "$env:USERPROFILE\.weasis\log" -File -ErrorAction SilentlyContinue | Select-String -Pattern 'ERROR|Exception|Refusing' | Select-Object -First 40 | ForEach-Object { $_.Line }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out" | Out-Null
          Copy-Item "$env:USERPROFILE\.weasis\log" "$env:RUNNER_TEMP\out\log" -Recurse -ErrorAction SilentlyContinue
          exit 0

      - name: Uninstall and confirm it is gone
        if: always()
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\lib.ps1"
          Get-Process | Where-Object { $_.Path -like 'C:\Program Files\Addis*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          $msi = (Get-ChildItem dl -Filter *.msi -Recurse | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP 'uninstall.log'
          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/l*v', "`"$log`"") -Wait -PassThru
          "msiexec /x exit code: $($p.ExitCode)"
          if ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) { Res PASS msi-uninstall "msiexec /x exit code $($p.ExitCode)" } else { Res FAIL msi-uninstall "msiexec /x exit code $($p.ExitCode)" }
          $dir = 'C:\Program Files\Addis Ortho Viewer'
          if (Test-Path $dir) { Res FAIL uninstall-folder-gone "$dir still exists: $((Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object Name) -join ', ')" } else { Res PASS uninstall-folder-gone "$dir removed" }
          & reg query 'HKCR\weasis-addisortho' 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { Res PASS uninstall-registry-gone "HKCR\weasis-addisortho removed" } else { Res FAIL uninstall-registry-gone "HKCR\weasis-addisortho still present" }
          $left = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Addis' }
          if ($left) { Res FAIL uninstall-start-menu-gone "left: $($left.FullName -join '; ')" } else { Res PASS uninstall-start-menu-gone "no Addis entries left in the Start menu" }
          "--- uninstall.log highlights"
          Select-String -Path $log -Pattern 'Return value 3|Removal (success|failed)|Error [0-9]+' | Select-Object -First 15 | ForEach-Object { $_.Line.Trim() }
          "user data left behind: " + (Test-Path "$env:USERPROFILE\.weasis")
          exit 0

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: smoke-windows
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/out
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/uninstall.log
          if-no-files-found: warn

      - name: Verdict
        if: always()
        shell: bash {0}
        run: |
          echo "=============== RESULTS windows"
          cat "$RUNNER_TEMP/results.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$RUNNER_TEMP/results.txt" ] || grep -q "CHECK FAIL" "$RUNNER_TEMP/results.txt"; then exit 1; fi
