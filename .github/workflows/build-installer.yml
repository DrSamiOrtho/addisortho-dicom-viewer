# Modified by Addis Ortho Trading PLC, 2026.
name: Build installers (Addis Ortho DICOM Viewer)
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build: "all", "none" (only the shared native package), or a comma-separated subset of windows-x86-64,macosx-x86-64,macosx-aarch64'
        required: false
        default: 'all'
      edition:
        description: 'Editions to build: "all", "both" (full and lite), "full" (Addis Ortho Viewer), "lite" (Addis Ortho Viewer Lite: 2D X-ray and CT viewing only) or "4gb" (Addis Ortho Viewer 4GB: every feature, 1 GB heap)'
        required: false
        default: 'all'
      release_tag:
        description: 'Release from main without pushing a tag: ao-<weasis version>-<n>, for example ao-4.7.3-1. The release job creates the tag on the built commit. Leave empty for a test build.'
        required: false
        default: ''
  # A tag ao-<weasis version>-<n> (for example ao-4.7.3-1) builds the three installers of all three
  # editions and publishes them as a GitHub pre-release; the complete source of the release is the
  # tag itself.
  push:
    tags:
      - 'ao-*'

# Least privilege: the build jobs only build and upload artifacts. Only the release job below
# gets write access, and only to create the release of a tag.
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      jpackage_matrix: ${{ steps.set.outputs.jpackage_matrix }}
      edition_count: ${{ steps.set.outputs.edition_count }}
    steps:
      - name: Compute build matrices from the platforms input
        id: set
        shell: bash
        env:
          PLATFORMS_INPUT: ${{ inputs.platforms }}
          EDITION_INPUT: ${{ inputs.edition }}
        run: |
          sel="$PLATFORMS_INPUT"
          [ -z "$sel" ] && sel="all"
          case "${EDITION_INPUT:-all}" in
            all) editions='["full","lite","4gb"]' ;;
            both) editions='["full","lite"]' ;;
            full|lite|4gb) editions="[\"$EDITION_INPUT\"]" ;;
            *) echo "::error::edition must be all, both, full, lite or 4gb, got $EDITION_INPUT"; exit 1 ;;
          esac
          jpkg=$(jq -cn --arg sel "$sel" --argjson editions "$editions" '
            [
              {key:"macosx-x86-64",  os:"macos-15-intel", platform:"x64",   wsystem:"macosx",  warc:"x86-64"},
              {key:"macosx-aarch64", os:"macos-latest",   platform:"arm64", wsystem:"macosx",  warc:"aarch64"},
              {key:"windows-x86-64", os:"windows-latest", platform:"x64",   wsystem:"windows", warc:"x86-64"}
            ]
            | map(select($sel == "all" or (.key as $k | ($sel | split(",")) | index($k) != null)))
            | map(del(.key))
            | [.[] as $p | $editions[] | $p + {edition: .}]')
          {
            echo "jpackage_matrix=$jpkg"
            echo "edition_count=$(echo "$editions" | jq length)"
          } >> "$GITHUB_OUTPUT"
          echo "Selected platforms: $sel"
          echo "Selected editions: $editions"
          echo "jpackage matrix: $jpkg"

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.WEASIS_VERSION }}
      cleanversion: ${{ env.WEASIS_CLEAN_VERSION }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK for compilation
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'

      - name: Build with Maven
        shell: bash
        run: |
          mvn -B clean install
          mvn -B -P compressXZ -f weasis-distributions clean package
          file="weasis-distributions/target/native-dist/weasis-native.zip"
          sha256sum "$file" >> "$file.sha256"

      - name: Retrieve version
        shell: bash
        run: |
          FVERSION=$(awk -F'[<>]' '/<revision>/{print $3}' weasis-parent/pom.xml)$(awk -F'[<>]' '/<changelist>/{print $3}' weasis-parent/pom.xml)
          echo "WEASIS_VERSION=${FVERSION}" >> $GITHUB_ENV

      - name: Set compatible version
        shell: bash
        run: |
          # The version people see, on the installers and their file names: AO_VERSION (Sami, 7 Nov 2026). WEASIS_VERSION stays the engine's.
          CVERSION=$(sed -n 's/.*AO_VERSION = "\([0-9.]*\)".*/\1/p' weasis-core/src/main/java/org/weasis/core/api/gui/util/AppProperties.java)
          [ -n "$CVERSION" ] || { echo "::error::no AO_VERSION in AppProperties.java"; exit 1; }
          echo "WEASIS_CLEAN_VERSION=${CVERSION}" >> $GITHUB_ENV

      - name: Upload the weasis package for building the native distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: weasis-native-${{ env.WEASIS_VERSION }}
          path: weasis-distributions/target/native-dist/weasis-native.*

  jpackage:
    name: jpackage (${{ matrix.edition }}, ${{ matrix.wsystem }}-${{ matrix.warc }})
    env:
      # The lite edition (prepare-lite.sh) and the 4gb edition each have their own name, identifier,
      # upgrade codes and shell port, so they install next to the full edition.
      EDITION: ${{ matrix.edition }}
      NAME: ${{ matrix.edition == 'lite' && 'Addis Ortho Viewer Lite' || matrix.edition == '4gb' && 'Addis Ortho Viewer 4GB' || 'Addis Ortho Viewer' }}
      IDENTIFIER: ${{ matrix.edition == 'lite' && 'com.addisortho.viewer.lite' || matrix.edition == '4gb' && 'com.addisortho.viewer.lite4gb' || 'com.addisortho.viewer' }}
      # CFBundleName, under 16 characters
      MAC_PACKAGE_NAME: ${{ matrix.edition == 'lite' && 'AO Viewer Lite' || matrix.edition == '4gb' && 'AO Viewer 4GB' || 'Addis Ortho' }}
      ARTIFACT_PREFIX: ${{ matrix.edition == 'lite' && 'addisortho-viewer-lite' || matrix.edition == '4gb' && 'addisortho-viewer-4gb' || 'addisortho-viewer' }}
      # Windows file properties (CompanyName, LegalCopyright, FileDescription) and macOS
      # NSHumanReadableCopyright; given to the app-image step as well as to the installer step.
      VENDOR: "Addis Ortho Trading PLC"
      COPYRIGHT: "© 2026 Addis Ortho Trading PLC. Based on Weasis © 2009-2026 Weasis Team"
      DESCRIPTION: ${{ matrix.edition == 'lite' && 'Addis Ortho DICOM Viewer Lite' || matrix.edition == '4gb' && 'Addis Ortho DICOM Viewer 4GB' || 'Addis Ortho DICOM Viewer' }}
      # Sign and notarise on macOS only when the Apple certificates are stored as repository
      # secrets; otherwise build unsigned installers for internal testing.
      MAC_SIGN: ${{ secrets.MACOS_CERTIFICATE_DEVELOPMENT != '' && 'yes' || 'no' }}
      WEASIS_INPUT: "native-dist/weasis-native/bin-dist"
      WEASIS_OUTPUT: "output-dist"
      WEASIS_INPUT_BIN: "native-dist/weasis-native/bin-dist/weasis"
      WEASIS_SCRIPT: "native-dist/weasis-native/build/script"
    runs-on: ${{ matrix.os }}
    needs: [setup, build]
    if: ${{ needs.setup.outputs.jpackage_matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jpackage_matrix) }}

    steps:
      - name: Set output version from build
        shell: bash
        run: |
          echo ${{needs.build.outputs.version}}
          echo ${{needs.build.outputs.cleanversion}}
          echo "WEASIS_VERSION=${{needs.build.outputs.version}}" >> $GITHUB_ENV
          echo "WEASIS_CLEAN_VERSION=${{needs.build.outputs.cleanversion}}" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Download weasis-native
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: weasis-native-${{ env.WEASIS_VERSION }}
          path: native-dist

      - name: Unzip the native package version
        shell: bash
        run: |
          unzip -o "native-dist/weasis-native.zip" -d "native-dist/weasis-native"

      - name: Remove binaries not related to the current architecture
        shell: bash
        run: |
          # Remove pack jar for launcher
          rm -f ${{ env.WEASIS_INPUT_BIN }}/*.jar.pack.gz
          # Remove unrelated weasis-opencv-core native packages
          find ${{ env.WEASIS_INPUT_BIN }}/bundle/weasis-opencv-core-* -type f ! -name "*-${{ matrix.wsystem }}-${{ matrix.warc }}-*" -exec rm -f {} \;
          # Remove unrelated jogamp native packages
          find ${{ env.WEASIS_INPUT_BIN }}/bundle/jogamp-* -type f ! -name "*-${{ matrix.wsystem }}-${{ matrix.warc }}-*" ! -name "jogamp-[0-9]*" -exec rm -f {} \;
          echo "$(ls ${{ env.WEASIS_INPUT_BIN }}/bundle/)"

      - name: Prepare the lite edition
        if: matrix.edition == 'lite'
        shell: bash
        run: |
          LITE_RES="lite-resources"
          bash "${{ env.WEASIS_SCRIPT }}/prepare-lite.sh" "${{ env.WEASIS_INPUT_BIN }}" \
            "${{ env.WEASIS_SCRIPT }}/resources/${{ matrix.wsystem }}" "$LITE_RES"
          echo "LITE_RES=$LITE_RES" >> "$GITHUB_ENV"

      - name: Apply the deployment specific preparation
        shell: bash
        run: |
          siteHook="${{ env.WEASIS_SCRIPT }}/prepare-input-site.sh"
          if [[ -f "$siteHook" ]] ; then
            bash "$siteHook" "${{ env.WEASIS_INPUT_BIN }}"
          else
            echo "No deployment specific preparation"
          fi

      - name: Add the Mesa software renderer (Windows only)
        # Addis Ortho: software 3D for PCs whose graphics chip has no OpenGL 3.3 (Intel HD 2000/3000).
        # The viewer loads these two DLLs from app/mesa only when the user chooses software 3D.
        # Mesa is MIT licensed; these are the pal1000/mesa-dist-win MSVC builds, checked by SHA-256.
        # The lite edition has no 3D.
        if: matrix.wsystem == 'windows' && matrix.edition != 'lite'
        shell: bash
        env:
          MESA_VERSION: "26.2.3"
          MESA_SHA256: "3f3613adb43cfd0f2e665ce2400b130c275f0b3317cb3a05566320a3a67589ed"
        run: |
          set -euo pipefail
          curl -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          echo "${MESA_SHA256}  mesa.7z" | sha256sum -c -
          7z e -y -omesa-x64 mesa.7z x64/opengl32.dll x64/libgallium_wgl.dll
          dest="${{ env.WEASIS_INPUT_BIN }}/mesa"
          mkdir -p "$dest"
          cp mesa-x64/opengl32.dll mesa-x64/libgallium_wgl.dll "$dest/"
          cat > "$dest/README.txt" <<EOF
          Mesa ${MESA_VERSION} software OpenGL renderer (llvmpipe), used by Addis Ortho Viewer only when
          "Software 3D" is chosen, for graphics chips without OpenGL 3.3.
          Binaries: https://github.com/pal1000/mesa-dist-win (MIT licence)
          Source: https://gitlab.freedesktop.org/mesa/mesa (MIT licence, https://docs.mesa3d.org/license.html)
          EOF
          ls -la "$dest"

      - name: Import Developer Certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c  # v7
        if: matrix.wsystem == 'macosx' && env.MAC_SIGN == 'yes'
        id: cert
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_DEVELOPMENT }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Import Installer Certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c  # v7
        if: matrix.wsystem == 'macosx' && env.MAC_SIGN == 'yes'
        with:
          create-keychain: "false"
          keychain-password: ${{ steps.cert.outputs.keychain-password }}
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_INSTALLER }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Install WiX Toolset (Windows only)
        if: matrix.wsystem == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "5.*"
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $WIX_VERSION = & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version
          Write-Host "Installed WiX version: $WIX_VERSION"
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/$WIX_VERSION
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.Util.wixext/$WIX_VERSION

      - name: Build app binary with jpackage
        shell: bash
        run: |
          machine=${{ matrix.wsystem }}
          RES="${LITE_RES:-${{ env.WEASIS_SCRIPT }}/resources/$machine}"

          # JDK_MODULES, customOptions and commonOptions are shared with package-weasis.sh
          source "${{ env.WEASIS_SCRIPT }}/launch-options.sh" "$machine" "$EDITION"

          # jpackage takes the icon, the Windows file properties and the pkg backgrounds from files
          # named after the app ("<name>.ico", "<name>.icns"...). Give the 4gb edition copies of
          # the full edition's, or its launcher, shortcuts and taskbar show the generic Java icon.
          # prepare-lite.sh has already done this for the lite edition.
          if [ "$EDITION" = "4gb" ] ; then
            for f in "$RES"/"Addis Ortho Viewer"*; do
              [ -f "$f" ] || continue
              cp -f "$f" "$RES/${{ env.NAME }}${f#"$RES/Addis Ortho Viewer"}"
            done
            # A custom Info.plist wins over --mac-package-identifier
            if [ -f "$RES/Info.plist" ] ; then
              sed -i.bak 's#<string>com.addisortho.viewer</string>#<string>${{ env.IDENTIFIER }}</string>#' "$RES/Info.plist"
              rm -f "$RES/Info.plist.bak"
            fi
            ls -la "$RES"
          fi

          # The lite edition has no Dicomizer
          declare -a launcherArgs=()
          if [ "$EDITION" != "lite" ] ; then
            launcherArgs=("--add-launcher" "Dicomizer=$RES/dicomizer-launcher.properties")
          fi

          declare -a signArgs=()
          if [ "$machine" = "macosx" ] && [ "$MAC_SIGN" != "yes" ] ; then
            echo "No Apple signing certificate: building an unsigned app bundle"
            signArgs=("--mac-package-identifier" "${{ env.IDENTIFIER }}" "--mac-package-name" "$MAC_PACKAGE_NAME")
          elif [ "$machine" = "macosx" ] ; then
            KEYCHAIN="$HOME/Library/Keychains/signing_temp.keychain-db"

            # Enumerate all identities in the keychain for diagnostics.
            echo "=== Identities found in signing keychain ==="
            security find-identity -v "$KEYCHAIN"

            # Resolve the Developer ID Application identity (without -p codesigning
            # to avoid trust-policy filtering on non-default keychains).
            SIGN_ID=$(security find-identity -v "$KEYCHAIN" \
              | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
            echo "Developer ID Application identity: $SIGN_ID"
            if [ -z "$SIGN_ID" ]; then
              echo "ERROR: No 'Developer ID Application' certificate found in $KEYCHAIN"
              exit 1
            fi

            # Extract just the user-name portion required by jpackage
            # e.g.  "Developer ID Application: Nicolas Roduit (TEAMID)" -> "Nicolas Roduit"
            MAC_SIGNING_USER=$(echo "$SIGN_ID" \
              | sed 's/^Developer ID Application: //' | sed 's/ (.*//')
            echo "jpackage signing user name: $MAC_SIGNING_USER"

            # Pre-sign ALL native libraries embedded in JARs.
            # jpackage --mac-sign will sign the extracted content of the app image,
            # but dylibs INSIDE jars must be signed before jpackage repackages them.
            for jar_file in "${{ env.WEASIS_INPUT_BIN }}"/*.jar "${{ env.WEASIS_INPUT_BIN }}"/bundle/*.jar; do
              [ -f "$jar_file" ] || continue
              if unzip -l "$jar_file" 2>/dev/null | grep -qE '\.(dylib|jnilib)$'; then
                echo "--- Signing native libs in: $jar_file"
                tmpdir=$(mktemp -d)
                unzip -q "$jar_file" -d "$tmpdir"
                while IFS= read -r -d '' lib; do
                  echo "  Signing: $lib"
                  codesign --force --options runtime --timestamp \
                    --sign "$SIGN_ID" --keychain "$KEYCHAIN" "$lib"
                done < <(find "$tmpdir" \( -name "*.dylib" -o -name "*.jnilib" \) -print0)
                jar_name=$(basename "$jar_file")
                (cd "$tmpdir" && jar cf "/tmp/$jar_name" .)
                mv -f "/tmp/$jar_name" "$jar_file"
                rm -rf "$tmpdir"
              fi
            done

            # Use jpackage's built-in signing (--mac-sign) which applies --options runtime
            # and --timestamp correctly in inside-out order, exactly like package-weasis.sh.
            signArgs=("--mac-package-identifier" "${{ env.IDENTIFIER }}" "--mac-package-name" "$MAC_PACKAGE_NAME" \
              "--mac-signing-key-user-name" "$MAC_SIGNING_USER" \
              "--mac-sign")
          fi

          jpackage --type app-image --input "${{ env.WEASIS_INPUT_BIN }}" --dest "${{ env.WEASIS_OUTPUT }}" --name "${{ env.NAME }}" \
          --main-jar weasis-launcher.jar --main-class org.weasis.launcher.AppLauncher --add-modules "$JDK_MODULES" \
          --resource-dir "$RES" --app-version "${{ env.WEASIS_CLEAN_VERSION }}" "${launcherArgs[@]}" \
          --vendor "${{ env.VENDOR }}" --copyright "${{ env.COPYRIGHT }}" --description "${{ env.DESCRIPTION }}" \
          "${signArgs[@]}" "${customOptions[@]}" "${commonOptions[@]}"

          if [ "$machine" = "macosx" ] && [ "$MAC_SIGN" = "yes" ] ; then
            APP_PATH="${{ env.WEASIS_OUTPUT }}/${{ env.NAME }}.app"
            echo "--- Verifying app bundle signature (deep + strict)"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"

            echo "--- Checking notarization requirements on all Mach-O binaries"
            fail=0
            while IFS= read -r -d '' bin; do
              # codesign -dvvv writes to stderr
              info=$(codesign -dvvv "$bin" 2>&1)
              cert=$(echo "$info" | grep "Authority=Developer ID Application" || true)
              ts=$(echo   "$info" | grep "^Timestamp=" || true)
              hr=$(echo   "$info" | grep "flags=0x10000(runtime)" || true)
              if [ -z "$cert" ] || [ -z "$ts" ] || [ -z "$hr" ]; then
                echo "FAIL: $bin"
                [ -z "$cert" ] && echo "  ✗ Developer ID Application authority not found"
                [ -z "$ts"   ] && echo "  ✗ Secure timestamp missing"
                [ -z "$hr"   ] && echo "  ✗ Hardened runtime flag (0x10000) missing"
                fail=1
              fi
            done < <(find "$APP_PATH/Contents/MacOS" "$APP_PATH/Contents/runtime" \
              -type f \( -name "*.dylib" -o -name "*.so" -o -name "jspawnhelper" \) -print0)
            # Also check the main launcher executables explicitly
            for bin in "$APP_PATH/Contents/MacOS/${{ env.NAME }}" "$APP_PATH/Contents/MacOS/Dicomizer"; do
              [ -f "$bin" ] || continue
              info=$(codesign -dvvv "$bin" 2>&1)
              cert=$(echo "$info" | grep "Authority=Developer ID Application" || true)
              ts=$(echo   "$info" | grep "^Timestamp=" || true)
              hr=$(echo   "$info" | grep "flags=0x10000(runtime)" || true)
              if [ -z "$cert" ] || [ -z "$ts" ] || [ -z "$hr" ]; then
                echo "FAIL: $bin"
                [ -z "$cert" ] && echo "  ✗ Developer ID Application authority not found"
                [ -z "$ts"   ] && echo "  ✗ Secure timestamp missing"
                [ -z "$hr"   ] && echo "  ✗ Hardened runtime flag (0x10000) missing"
                fail=1
              fi
            done
            if [ "$fail" -ne 0 ]; then
              echo "ERROR: One or more binaries do not meet notarization requirements."
              exit 1
            fi
            echo "All checked binaries meet notarization requirements."
          fi

          echo "$(ls -la ${{ env.WEASIS_OUTPUT }})"

      - name: Prove software 3D on a PC without a graphics driver (Windows only)
        # The Windows runner has no GPU driver (OpenGL 1.1 "GDI Generic"), like a PC whose chip is
        # too old. JOGL must fail there on its own, and reach OpenGL 4.x through the bundled Mesa
        # once the viewer's loading order (libgallium_wgl.dll, then opengl32.dll, then JOGL's switch
        # to Mesa's own wgl pixel-format calls) is applied.
        if: matrix.wsystem == 'windows' && matrix.edition != 'lite'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gl-probe && cd gl-probe
          base=https://repo1.maven.org/maven2/org/jogamp
          for j in gluegen/gluegen-rt/2.6.0/gluegen-rt-2.6.0 jogl/jogl-all/2.6.0/jogl-all-2.6.0; do
            curl -fsSLO "$base/$j.jar"
            curl -fsSLO "$base/$j-natives-windows-amd64.jar"
          done
          cat > GlProbe.java <<'EOF'
          import com.jogamp.opengl.*;
          import java.nio.file.Path;

          public class GlProbe {
            static void setEnv(String name, String value) throws Throwable {
              var linker = java.lang.foreign.Linker.nativeLinker();
              var k32 = java.lang.foreign.SymbolLookup.libraryLookup("kernel32", java.lang.foreign.Arena.global());
              var h = linker.downcallHandle(k32.find("SetEnvironmentVariableW").orElseThrow(),
                  java.lang.foreign.FunctionDescriptor.of(java.lang.foreign.ValueLayout.JAVA_INT,
                      java.lang.foreign.ValueLayout.ADDRESS, java.lang.foreign.ValueLayout.ADDRESS));
              try (var a = java.lang.foreign.Arena.ofConfined()) {
                int ok = (int) h.invokeExact(a.allocateFrom(name, java.nio.charset.StandardCharsets.UTF_16LE),
                    a.allocateFrom(value, java.nio.charset.StandardCharsets.UTF_16LE));
              }
            }

            public static void main(String[] args) throws Throwable {
              if (args.length > 0) {
                Path dir = Path.of(args[0]);
                setEnv("GALLIUM_DRIVER", "llvmpipe");
                System.load(dir.resolve("libgallium_wgl.dll").toAbsolutePath().toString());
                System.load(dir.resolve("opengl32.dll").toAbsolutePath().toString());
                System.setProperty("jogamp.primary.library.path", dir.toAbsolutePath().toString());
                System.setProperty("jogl.windows.useWGLVersionOf5WGLGDIFuncSet", "true");
              }
              GLProfile.initSingleton();
              GLProfile profile;
              try {
                profile = GLProfile.get(GLProfile.GL4);
              } catch (Exception e) {
                profile = GLProfile.get(GLProfile.GL3);
              }
              GLDrawable drawable = GLDrawableFactory.getFactory(profile)
                  .createOffscreenDrawable(null, new GLCapabilities(profile), null, 1, 1);
              drawable.setRealized(true);
              GLContext ctx = drawable.createContext(null);
              ctx.makeCurrent();
              GL gl = ctx.getGL();
              int[] tex = new int[1];
              gl.glGetIntegerv(GL2ES2.GL_MAX_3D_TEXTURE_SIZE, tex, 0);
              System.out.println("PROBE profile=" + profile.getName()
                  + " version=" + gl.glGetString(GL.GL_VERSION)
                  + " renderer=" + gl.glGetString(GL.GL_RENDERER)
                  + " max3d=" + tex[0]);
              if (gl.isGL4()) {
                GL4 gl4 = gl.getGL4();
                int sh = gl4.glCreateShader(GL4.GL_COMPUTE_SHADER);
                gl4.glShaderSource(sh, 1, new String[] {
                    "#version 430\nlayout(local_size_x=1) in;\nvoid main(){}\n"}, null);
                gl4.glCompileShader(sh);
                int[] ok = new int[1];
                gl4.glGetShaderiv(sh, GL4.GL_COMPILE_STATUS, ok, 0);
                System.out.println("PROBE compute shader compiled=" + (ok[0] != 0));
              }
              ctx.release();
              System.exit(0);
            }
          }
          EOF
          cp="gluegen-rt-2.6.0.jar;jogl-all-2.6.0.jar"
          echo "--- System OpenGL (expected to fail or be below 3.3)"
          java -cp "$cp" GlProbe.java 2>&1 | tail -5 || true
          echo "--- Bundled Mesa from the app image"
          ls -la "../${{ env.WEASIS_OUTPUT }}/${{ env.NAME }}/app/mesa" || true
          mesa="../${{ env.WEASIS_OUTPUT }}/${{ env.NAME }}/app/mesa"
          out=$(java -cp "$cp" GlProbe.java "$mesa" 2>&1 | tail -40) || true
          echo "$out"
          echo "$out" | grep -q "renderer=llvmpipe" || { echo "Mesa was not used"; exit 1; }
          echo "$out" | grep -qE "version=4\.[3-9]" || { echo "Mesa did not give OpenGL 4.3 or later"; exit 1; }

      - name: Start the real viewer in software 3D (Windows only)
        # The 3D check runs when the viewer starts, so its log shows whether the app itself reaches
        # llvmpipe. Informational: a GUI start on the runner can fail for reasons of its own.
        if: matrix.wsystem == 'windows' && matrix.edition != 'lite'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          exe="${{ env.WEASIS_OUTPUT }}/${{ env.NAME }}/${{ env.NAME }}.exe"
          JAVA_TOOL_OPTIONS="-Dweasis.3d.software=true" "$exe" &
          pid=$!
          for i in $(seq 1 24); do
            sleep 5
            if grep -rqs -E "Video card for OpenGL|Cannot init OpenGL" "$USERPROFILE/.weasis" 2>/dev/null; then break; fi
          done
          sleep 5
          log=$(grep -rhs -E "Software 3D|Video card for OpenGL|OpenGL context created|Cannot init OpenGL|IllegalState" "$USERPROFILE/.weasis" | cut -c1-300 | head -20)
          echo "$log"
          taskkill //F //T //PID $pid >/dev/null 2>&1 || true
          taskkill //F //IM "${{ env.NAME }}.exe" >/dev/null 2>&1 || true
          echo "$log" | grep -q "Software 3D: drawing with llvmpipe" || { echo "The viewer did not reach llvmpipe"; exit 1; }

      - name: Build package with jpackage
        shell: bash
        env:
          FILE_ASSOC: "${{ env.WEASIS_SCRIPT }}/file-associations.properties"
        run: |
          mkdir -p final-dist
          machine=${{ matrix.wsystem }}
          ARC_NAME=${{ matrix.warc }}
          RES="${LITE_RES:-${{ env.WEASIS_SCRIPT }}/resources/$machine}"
          if [ "$machine" = "windows" ] ; then
            if [ "$EDITION" = "lite" ] ; then
              # Own upgrade codes and jpackage's default MSI template (no weasis-addisortho:// scheme)
              [ "$ARC_NAME" = "aarch64" ] && UPGRADE_UID="ef84b678-2032-4f0a-b9c4-b5807f045b9a" || UPGRADE_UID="0cad2ecd-35e6-4aa7-9647-16f80dcc7a31"
              MSI_RES="$RES"
            elif [ "$EDITION" = "4gb" ] ; then
              # Own upgrade codes: installing it must not remove the full edition
              [ "$ARC_NAME" = "aarch64" ] && UPGRADE_UID="a5a09c96-fab0-47e7-9fce-7e3a1b812bae" || UPGRADE_UID="a905d395-ba9f-4dc3-831c-53687cd447a6"
              MSI_RES="$RES/msi/${ARC_NAME}"
            else
              [ "$ARC_NAME" = "aarch64" ] && UPGRADE_UID="1d34dbc0-804b-491f-b9b7-cddec4b42771" || UPGRADE_UID="4179fa98-ca01-4739-b89e-92aff0702b48"
              MSI_RES="$RES/msi/${ARC_NAME}"
            fi
            jpackage --type "msi" --app-image "${{ env.WEASIS_OUTPUT }}/${{ env.NAME }}" --dest "${{ env.WEASIS_OUTPUT }}" --name "${{ env.NAME }}" --resource-dir "$MSI_RES" \
            --license-file "${{ env.WEASIS_INPUT }}/Licence.txt" --description "${{ env.DESCRIPTION }}" --win-upgrade-uuid "$UPGRADE_UID" \
            --win-menu --win-menu-group "${{ env.NAME }}" --copyright "${{ env.COPYRIGHT }}" --app-version "${{ env.WEASIS_CLEAN_VERSION }}" \
            --vendor "${{ env.VENDOR }}" --file-associations "${{ env.FILE_ASSOC }}" --verbose
            cp ${{ env.WEASIS_OUTPUT }}/*.msi "final-dist/${{ env.NAME }}-${{ env.WEASIS_CLEAN_VERSION }}-${ARC_NAME}.msi"
          elif [ "$machine" = "macosx" ] ; then
            # Do not set verbose for public build.
            # Do NOT pass --mac-sign here: the app bundle was already signed with proper
            # --options runtime + --timestamp in the app-image step above.
            # Using --mac-sign at the pkg stage causes jpackage to re-sign every dylib
            # without --timestamp, which breaks Apple notarization.
            jpackage --type "pkg" --app-image "${{ env.WEASIS_OUTPUT }}/${{ env.NAME }}.app" --dest "${{ env.WEASIS_OUTPUT }}" --name "${{ env.NAME }}" --resource-dir "$RES" \
            --license-file "${{ env.WEASIS_INPUT }}/Licence.txt" --copyright "${{ env.COPYRIGHT }}" --app-version "${{ env.WEASIS_CLEAN_VERSION }}" --mac-package-identifier "${{ env.IDENTIFIER }}"

            # Sign the unsigned .pkg with the Developer ID Installer certificate.
            # productsign only wraps the outer package; it does not touch the app contents.
            UNSIGNED_PKG="${{ env.WEASIS_OUTPUT }}/${{ env.NAME }}-${{ env.WEASIS_CLEAN_VERSION }}.pkg"
            SIGNED_PKG="final-dist/${{ env.NAME }}-${{ env.WEASIS_CLEAN_VERSION }}-${ARC_NAME}.pkg"
            # No version check on the app: 1.0 follows 4.7.3, and with the check macOS says "successful" and keeps the
            # higher version (tried on a test package, 7 Nov 2026). A new package always replaces the installed app.
            rm -rf pkg-x
            pkgutil --expand "$UNSIGNED_PKG" pkg-x
            find pkg-x -name PackageInfo -print0 | xargs -0 perl -0pi -e 's#<bundle-version>.*?</bundle-version>#<bundle-version/>#s'
            if find pkg-x -name PackageInfo -print0 | xargs -0 grep -q '<bundle id=.*' && find pkg-x -name PackageInfo -print0 | xargs -0 perl -0ne 'exit 1 if m#<bundle-version>#'; then :; else echo "::error::the version check is still in the package"; exit 1; fi
            rm -f "$UNSIGNED_PKG"
            pkgutil --flatten pkg-x "$UNSIGNED_PKG"
            rm -rf pkg-x
            if [ "$MAC_SIGN" != "yes" ] ; then
              cp "$UNSIGNED_PKG" "final-dist/${{ env.NAME }}-${{ env.WEASIS_CLEAN_VERSION }}-${ARC_NAME}-unsigned.pkg"
              echo "APP_ARTIFACT=${ARTIFACT_PREFIX}-${machine}-${ARC_NAME}-${{ env.WEASIS_VERSION }}" >> $GITHUB_ENV
              exit 0
            fi
            KEYCHAIN="$HOME/Library/Keychains/signing_temp.keychain-db"
            INSTALLER_ID=$(security find-identity -v -p basic "$KEYCHAIN" \
              | grep "Developer ID Installer" | head -1 | awk -F'"' '{print $2}')
            echo "Signing pkg with installer identity: $INSTALLER_ID"
            productsign --sign "$INSTALLER_ID" --keychain "$KEYCHAIN" --timestamp \
              "$UNSIGNED_PKG" "$SIGNED_PKG"
          fi
          echo "APP_ARTIFACT=${ARTIFACT_PREFIX}-${machine}-${ARC_NAME}-${{ env.WEASIS_VERSION }}" >> $GITHUB_ENV

      - name: Notarize Release Build
        if: matrix.wsystem == 'macosx' && env.MAC_SIGN == 'yes'
        shell: bash
        run: |
          SUBMISSION=$(xcrun notarytool submit \
            "final-dist/${{ env.NAME }}-${{ env.WEASIS_CLEAN_VERSION }}-${{ matrix.warc }}.pkg" \
            --apple-id "${{ secrets.APPLE_DEVELOPER_AC_USERNAME }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.WEASIS_PWD }}" \
            --wait --output-format json)
          echo "$SUBMISSION"
          STATUS=$(echo "$SUBMISSION" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          ID=$(echo "$SUBMISSION" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed with status: $STATUS. Fetching log..."
            xcrun notarytool log "$ID" \
              --apple-id "${{ secrets.APPLE_DEVELOPER_AC_USERNAME }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.WEASIS_PWD }}"
            exit 1
          fi

      - name: Staple Release Build
        if: matrix.wsystem == 'macosx' && env.MAC_SIGN == 'yes'
        shell: bash
        run: |
          xcrun stapler staple \
            "final-dist/${{ env.NAME }}-${{ env.WEASIS_CLEAN_VERSION }}-${{ matrix.warc }}.pkg"

      - name: Add checksum sha256 file
        shell: bash
        run: |
          for file in final-dist/*; do
            if [[ -f "$file" ]]; then
              if [[ "$(uname -s)" == "Darwin" ]]; then
                shasum -a 256 "$file" >> "$file.sha256"
              else
                sha256sum "$file" >> "$file.sha256"
              fi
            fi
          done

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.APP_ARTIFACT }}
          path: final-dist

  # Runs only for a pushed tag ao-*; a manual run never publishes anything. The installers are
  # unsigned (the macOS ones when the Apple secrets are missing, the Windows ones always), so the
  # release is marked as a pre-release; drop --prerelease once both platforms are signed.
  release:
    name: Publish the GitHub release
    # A pushed ao-* tag, or a manual run on main with release_tag set (for clients that cannot push tags)
    if: ${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'ao-')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && startsWith(inputs.release_tag, 'ao-')) }}
    needs: [setup, build, jpackage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release_tag || github.ref_name }}
      WEASIS_VERSION: ${{ needs.build.outputs.version }}
      EDITION_COUNT: ${{ needs.setup.outputs.edition_count }}

    steps:
      - name: Check that the tag matches the version that was built
        shell: bash
        run: |
          case "$TAG" in
            "ao-${WEASIS_VERSION}-"[0-9]*) echo "Tag $TAG releases Weasis $WEASIS_VERSION" ;;
            *) echo "::error::Tag $TAG does not match ao-${WEASIS_VERSION}-<n>, the version in weasis-parent/pom.xml"; exit 1 ;;
          esac

      - name: Download the installers of every edition
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: addisortho-viewer-*-${{ needs.build.outputs.version }}
          merge-multiple: true
          path: release-files

      - name: Check the files and rename them without spaces
        shell: bash
        working-directory: release-files
        run: |
          shopt -s nullglob
          ls -la
          msi=(*.msi); pkg=(*.pkg)
          if [ "${#msi[@]}" -ne "$EDITION_COUNT" ] || [ "${#pkg[@]}" -ne $((2 * EDITION_COUNT)) ]; then
            echo "::error::Expected $EDITION_COUNT .msi and $((2 * EDITION_COUNT)) .pkg installers, found ${#msi[@]} and ${#pkg[@]}"
            exit 1
          fi
          for f in *.msi *.pkg; do
            expected=$(awk '{print $1}' "$f.sha256")
            actual=$(sha256sum "$f" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "::error::Checksum of $f does not match its .sha256 file"
              exit 1
            fi
            new="${f// /-}"
            mv "$f" "$new"
            rm "$f.sha256"
            sha256sum "$new" > "$new.sha256"
          done
          ls -la
          cat ./*.sha256

      - name: Create the release
        shell: bash
        run: |
          VERSION="${TAG#ao-}"
          cat > notes.md <<EOF
          Addis Ortho DICOM Viewer ${VERSION}: Weasis ${WEASIS_VERSION} with the Addis Ortho name, logos, theme, start screen and menu changes.

          **Not a certified medical device** (CE, FDA or EFDA). For image review and surgical planning support only, not for primary diagnosis.

          **These installers are not signed**, so macOS and Windows warn on first use:
          - macOS: open the .pkg; if it is blocked, go to System Settings, Privacy and Security, and click Open Anyway.
          - Windows: in the blue "Windows protected your PC" window click More info, then Run anyway.

          Files: macOS Apple Silicon (aarch64) and Intel (x86-64) .pkg, Windows x64 .msi, each with its .sha256 checksum.

          **Addis Ortho Viewer Lite** (files named Addis-Ortho-Viewer-Lite-...): a smaller edition for viewing X-ray and CT images in 2D only, with measurements, window/level, zoom and stack scrolling. It leaves out 3D, MPR/MIP, RT, SR, ECG and audio, DICOM send and query/retrieve, CD burning, the Dicomizer and translations (English only). It installs next to the full viewer and keeps its own settings.

          **Addis Ortho Viewer 4GB** (files named Addis-Ortho-Viewer-4GB-...): every feature of the full viewer, for PCs with 4 GB of RAM: a fixed 1 GB memory limit and smaller 3D textures. It installs next to the other two.

          The complete source code of this release is this tag: https://github.com/${GITHUB_REPOSITORY}/tree/${TAG}. The program as a whole is distributed under the GNU General Public License version 3; see the licence page of the installer and legal/THIRD-PARTY-NOTICES.txt in the installed application.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists (re-run): replacing its files"
            gh release upload "$TAG" release-files/* --clobber
            gh release edit "$TAG" --title "Addis Ortho DICOM Viewer ${VERSION}" --notes-file notes.md --prerelease
          else
            # A pushed tag must already exist; a manual release creates the tag on the commit that was built
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then tagArgs=(--verify-tag); else tagArgs=(--target "$GITHUB_SHA"); fi
            gh release create "$TAG" release-files/* "${tagArgs[@]}" --title "Addis Ortho DICOM Viewer ${VERSION}" \
              --notes-file notes.md --prerelease
          fi
          gh release view "$TAG" --json url,isPrerelease,assets --jq '{url, isPrerelease, assets: [.assets[].name]}'
