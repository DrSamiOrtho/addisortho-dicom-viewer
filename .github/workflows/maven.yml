name: Build
on:
  push:
    branches:
      - main
      - 'addisortho/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
permissions:
  contents: read
# Cancel superseded runs on the same branch/PR; the latest push is the only one worth building.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK for compilation
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'

      - name: Build and test
        run: mvn -B -ntp install

      - name: Check the third-party notice
        run: |
          f=target/generated-resources/legal/THIRD-PARTY-NOTICES.txt
          test -s "$f"
          grep -q "based in part on the work of the Independent JPEG Group" "$f"
          ! grep -qi "unknown license" "$f"
          echo "$(grep -c '^  \* ' "$f") third-party libraries listed"
          echo "::group::THIRD-PARTY-NOTICES.txt"
          cat "$f"
          echo "::endgroup::"
